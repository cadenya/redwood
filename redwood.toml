[lang.cli.display]
default = "table"
columns = [
  { header = "ID", path = ".metadata.id" },
  { header = "EXTERNAL ID", path = ".metadata.externalId" },
  { header = "NAME", path = ".metadata.name" },
  { header = "CREATED", path = ".metadata.createdAt" },
  { header = "STATE", path = ".state" },
]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/agents"]
columns = [
  { header = "VARIATION MODE", path = ".spec.variationSelectionMode" },
]

[lang.cli.display.methods."get /v1/account/profiles"]
columns = [{ header = "TYPE", path = ".spec.type" }]

[lang.cli.display.methods."get /v1/account/workspaces/{workspaceId}/members"]
columns = [{ header = "PROFILE", path = ".profileId" }, { header = "ACTOR", path = ".actorId" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/agents/{agentId}/schedules"]
columns = [{ header = "SCHEDULE", path = ".spec.schedule" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/memory_layers"]
columns = [{ header = "TYPE", path = ".spec.type" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/memory_layers/{memoryLayerId}/entries"]
columns = [{ header = "KEY", path = ".spec.key" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/models"]
columns = [{ header = "PROVIDER", path = ".spec.provider" }, { header = "FAMILY", path = ".spec.family" }]

# Objective events: the discriminated payload's tag plus its compact JSON,
# cut to 30 chars in table mode (extended shows the whole document).
[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/objectives/{objectiveId}/events"]
columns = [
  { header = "TYPE", path = ".data.type" },
  { header = "WINDOW", path = ".contextWindowId" },
  { header = "DATA", path = ".data", truncate = 30 },
]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/objectives/{objectiveId}/tool_calls"]
columns = [{ header = "STATUS", path = ".status" }, { header = "EXECUTION", path = ".executionStatus" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/tool_sets/{toolSetId}/usage"]
columns = [{ header = "ASSIGNED", path = ".assignedAt" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/tool_sets/{toolSetId}/tools"]
columns = [{ header = "APPROVAL", path = ".spec.requiresApproval" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/widget_sessions"]
columns = [{ header = "WIDGET", path = ".spec.widgetId" }]

[lang.cli.display.methods."get /v1/workspaces/{workspaceId}/widgets"]
columns = [{ header = "AGENT", path = ".spec.agentId" }]

[sse]
skip_events = ["ping", "open"]

# CLI browser login (ENG-617): RFC 8628 device authorization against the
# webui-hosted endpoints. Endpoints deploy with ENG-619; until then
# `cadenya auth login` fails fast with an HTTP error.
[lang.cli.auth]
device_authorization_endpoint = "https://app.cadenya.com/api/cli/oauth/device_authorization"
token_endpoint = "https://app.cadenya.com/api/cli/oauth/token"
client_id = "cadenya-cli"
workspaces_param = "workspaceId"
