# Spec-wide generator policy. Every setting is optional; redwood derives
# sensible defaults from the OpenAPI document itself.

[api]
name = "Cadenya"
base_url = "https://api.cadenya.com"
# Params that may be set once at client construction (or via env var,
# e.g. CADENYA_WORKSPACE_ID) instead of on every call.
client_params = ["workspaceId"]

# Method-name overrides, keyed by operationId, for when inference is not
# what you want:
# [methods]
# "AccountService_GetAccount" = "whoami"

# Resource renames. A dotted target nests the resource under a parent
# accessor (one level): client.agents.variations, `cadenya agents variations`.
# Type names keep deriving from the original identity, so they stay unique.
[resources]
agent_variations = "agents.variations"
agent_schedules = "agents.schedules"
tools = "tool_sets.tools"
tool_set_secrets = "tool_sets.secrets"
memory_entries = "memory_layers.entries"

# Type re-labels, for generation artifacts that deserve friendlier names
# (protobuf-shaped names, awkward contextual enums). Applied across every
# backend and validated: unknown sources and colliding targets are errors.
# [mapping]
# "AgentVariationSpec_CompactionConfig" = "CompactionConfig"

# ---- per-language configuration (single-file; replaces <lang>.config.toml) ----

[lang.typescript]
repository = "https://github.com/cadenya/cadenya-typescript"
license = "Apache-2.0"
package_name = "@cadenya/cadenya"
package_version = "1.0.1"

[lang.go]
module_path = "go.cadenya.com/cadenya-go"
package_name = "cadenya"
sdk_version = "1.0.0"

[lang.go.special_casings]
openai = "OpenAI"
openrouter = "OpenRouter"

[lang.python]
license = "Apache-2.0"
package_name = "cadenya"
package_version = "1.0.0"
homepage = "https://cadenya.com"

[lang.ruby]
license = "Apache-2.0"
gem_name = "cadenya"
package_version = "1.0.0"
homepage = "https://cadenya.com"

[lang.cli]
module_path = "go.cadenya.com/cadenya-cli"
binary_name = "cadenya"
sdk_module = "go.cadenya.com/cadenya-go"
# The generated SDK lives next door during development.
sdk_replace = "../go"
version = "1.0.0"

# Top-level spellings for nested commands users expect at the root.
[lang.cli.aliases]
whoami = "profiles whoami"

# Request-body flags ([lang.cli.body]): every scalar field of a body is a
# flag named by its wire path with `metadata`/`spec` dropped; unions
# collapse onto their arms (--mcp-url selects the mcp adapter). Renames
# shorten the long configuration prefixes on agents and variations.
[lang.cli.body.rename."post /v1/workspaces/{workspaceId}/agents"]
"defaultVariation.spec.modelConfig" = "model"
"defaultVariation.spec.compactionConfig" = "compaction"
"defaultVariation.spec.progressiveDiscovery" = "discovery"

[lang.cli.body.rename."post /v1/workspaces/{workspaceId}/agents/{agentId}/variations"]
"spec.modelConfig" = "model"
"spec.compactionConfig" = "compaction"
"spec.progressiveDiscovery" = "discovery"

[lang.cli.body.rename."patch /v1/workspaces/{workspaceId}/agents/{agentId}/variations/{id}"]
"spec.modelConfig" = "model"
"spec.compactionConfig" = "compaction"
"spec.progressiveDiscovery" = "discovery"

[lang.cli.install]
homebrew_tap = "cadenya/tools"
chocolatey_package = "cadenya"
releases_url = "https://github.com/cadenya/cadenya-cli/releases"

[lang.cli.special_casings]
openai = "OpenAI"
openrouter = "OpenRouter"

# The frozen public positional contract: path placeholders in order,
# minus the client-defaultable workspaceId. Explicit [] means "no
# positionals" — every operation is listed so the surface cannot drift
