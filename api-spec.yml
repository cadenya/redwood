          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/widgets/{id}:unarchive:
    post:
      tags:
        - WidgetService
        - Widgets
      summary: Unarchive a widget
      description: Transitions an archived widget back to STATE_ACTIVE so its hostname serves traffic again. Sessions revoked by archival stay revoked; mint new ones.
      operationId: WidgetService_UnarchiveWidget
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: id
          in: path
          description: Widget ID. Accepts the canonical `wgt_…` form or the `external_id:<value>` form.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnarchiveWidgetRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/workspace_secrets:
    get:
      tags:
        - WorkspaceSecretService
        - Workspace Secrets
      summary: List workspace secrets
      description: Lists all workspace secrets in the workspace
      operationId: WorkspaceSecretService_ListWorkspaceSecrets
      parameters:
        - name: workspaceId
          in: path
          description: The workspace whose secrets will be listed.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: prefix
          in: query
          description: 'Filter expression (query param: prefix)'
          schema:
            type: string
        - name: query
          in: query
          description: Free-form search query
          schema:
            type: string
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time)
          schema:
            type: string
        - name: includeInfo
          in: query
          description: When set to true you may use more of your alloted API rate-limit
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceSecretsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      tags:
        - WorkspaceSecretService
        - Workspace Secrets
      summary: Create a new workspace secret
      description: Creates a new workspace secret in the workspace
      operationId: WorkspaceSecretService_CreateWorkspaceSecret
      parameters:
        - name: workspaceId
          in: path
          description: The workspace that will own this secret.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceSecretRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSecret'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/workspace_secrets/{id}:
    get:
      tags:
        - WorkspaceSecretService
        - Workspace Secrets
      summary: Get a workspace secret by ID
      description: Retrieves a workspace secret by ID from the workspace
      operationId: WorkspaceSecretService_GetWorkspaceSecret
      parameters:
        - name: workspaceId
          in: path
          description: The workspace the secret belongs to.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: id
          in: path
          description: The secret to retrieve.
          required: true
          schema:
            type: string
            example: wsecret_01HXKD2E5NQM3T9AYWCF586W5A
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSecret'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      tags:
        - WorkspaceSecretService
        - Workspace Secrets
      summary: Delete a workspace secret
      description: Deletes a workspace secret from the workspace
      operationId: WorkspaceSecretService_DeleteWorkspaceSecret
      parameters:
        - name: workspaceId
          in: path
          description: The workspace the secret belongs to.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: id
          in: path
          description: The secret to delete.
          required: true
          schema:
            type: string
            example: wsecret_01HXKD2E5NQM3T9AYWCF586W5A
      responses:
        '200':
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    patch:
      tags:
        - WorkspaceSecretService
        - Workspace Secrets
      summary: Update a workspace secret
      description: Updates a workspace secret in the workspace
      operationId: WorkspaceSecretService_UpdateWorkspaceSecret
      parameters:
        - name: workspaceId
          in: path
          description: The workspace the secret belongs to.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: id
          in: path
          description: The secret to update.
          required: true
          schema:
            type: string
            example: wsecret_01HXKD2E5NQM3T9AYWCF586W5A
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceSecretRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSecret'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
components:
  schemas:
    AIProviderConfig:
      oneOf:
        - $ref: '#/components/schemas/AIProviderConfig_Openrouter'
        - $ref: '#/components/schemas/AIProviderConfig_Openai'
        - $ref: '#/components/schemas/AIProviderConfig_OpenaiCompatible'
      discriminator:
        propertyName: type
        mapping:
          openrouter: '#/components/schemas/AIProviderConfig_Openrouter'
          openai: '#/components/schemas/AIProviderConfig_Openai'
          openaiCompatible: '#/components/schemas/AIProviderConfig_OpenaiCompatible'
      description: |-
        AIProviderConfig holds non-secret, provider-specific settings. The set case
         must correspond to AIProviderKeySpec.provider. Providers with no settings
         (Anthropic, Gemini) simply leave this unset. The endpoint of a named provider
         is fixed and intentionally not overridable here; use the OpenAI-compatible
         provider to target a custom endpoint.
    AIProviderCredential:
      oneOf:
        - $ref: '#/components/schemas/AIProviderCredential_ApiKey'
        - $ref: '#/components/schemas/AIProviderCredential_Headers'
      discriminator:
        propertyName: type
        mapping:
          apiKey: '#/components/schemas/AIProviderCredential_ApiKey'
          headers: '#/components/schemas/AIProviderCredential_Headers'
      description: |-
        AIProviderCredential is the secret material used to authenticate with a
         provider. The set case must correspond to AIProviderKeySpec.provider. The
         server encrypts the serialized message at rest and never returns it on reads.
    AIProviderKey:
      required:
        - metadata
        - spec
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/AIProviderKeySpec'
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AIProviderKeyInfo'
          description: |-
            Server-populated info (e.g. how many models route through this key).
             Populated on reads when requested; see ListAIProviderKeysRequest.include_info.
      description: |-
        AIProviderKey is a credential for an AI provider, scoped to a workspace.
         Most keys are customer-provided (BYOK); Cadenya also provisions promotional
         keys (see AIProviderKeyInfo.is_promotional), which cannot be modified or
         deleted by account administrators. The secret value is never returned in
         responses.
    AIProviderKeyInfo:
      required:
        - enabledModelCount
        - disabledModelCount
        - isPromotional
      type: object
      properties:
        enabledModelCount:
          readOnly: true
          type: integer
          description: Number of enabled models provisioned on this key.
          format: int32
        disabledModelCount:
          readOnly: true
          type: integer
          description: Number of disabled models provisioned on this key.
          format: int32
        isPromotional:
          readOnly: true
          type: boolean
          description: |-
            Cadenya includes promotional keys (one for onboarding, and potentially more in the future).
             These are not added or maintained by account administrators.
      description: |-
        AIProviderKeyInfo carries server-derived, read-only details about a key, for
         AI provider management UIs.
    AIProviderKeySpec:
      type: object
      properties:
        provider:
          enum:
            - AI_PROVIDER_UNSPECIFIED
            - AI_PROVIDER_OPENROUTER
            - AI_PROVIDER_OPENAI
            - AI_PROVIDER_ANTHROPIC
            - AI_PROVIDER_GEMINI
            - AI_PROVIDER_OPENAI_COMPATIBLE
          type: string
          description: The AI provider this key authenticates against.
          format: enum
        credentials:
          allOf:
            - $ref: '#/components/schemas/AIProviderCredential'
          description: |-
            The provider credential. Accepted on create/update; never populated in
             responses (the server returns an empty value to avoid leaking the secret).
        config:
          allOf:
            - $ref: '#/components/schemas/AIProviderConfig'
          description: |-
            Non-secret, provider-specific settings (OpenAI org/project, OpenRouter
             region, OpenAI-compatible base URL). The set case must correspond to
             `provider`. Returned on reads. Optional: omit to accept provider defaults.
    APIKey:
      required:
        - metadata
        - spec
        - state
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/AccountResourceMetadata'
        spec:
          $ref: '#/components/schemas/APIKeySpec'
        info:
          $ref: '#/components/schemas/APIKeyInfo'
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - STATE_ENABLED
            - STATE_DISABLED
          type: string
          description: |-
            The current lifecycle state of the API key. Output only. Keys are
             created STATE_ENABLED; use the :disable and :enable actions to
             transition between states.
          format: enum
      description: |-
        An API key. Every key belongs to exactly one workspace and is managed via
         the workspace-scoped API key routes. The only exception is the
         system-managed global account key, which spans all workspaces and is
         managed via the account global_api_key routes.
    APIKeyInfo:
      type: object
      properties:
        createdBy:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Profile'
          description: The profile that created the key.
    APIKeySpec:
      required:
        - token
        - system
      type: object
      properties:
        token:
          readOnly: true
          type: string
          description: |-
            The bearer token used to authenticate as this API key. Returned only on
             creation and rotation; subsequent reads omit this field.
        description:
          type: string
          description: Free-form description of what this API key is used for.
        permissions:
          type: array
          items:
            type: string
          description: |-
            Scopes granted to this key. Each entry is a colon-separated
             resource:verb string (e.g. "objectives:manage").

             Resources: agents, objectives, tools, memory, api_keys, workspaces,
             widgets, widget_sessions, secrets, account.
             Verbs: read and manage, where manage implies read — a stored scope set
             is normalized to drop "x:read" when "x:manage" is present. The secrets
             and account resources support only manage. "*" is an explicit
             full-access grant.

             Scopes are deny-by-default: a key with an empty list can call only
             scope-free endpoints. Full access is always an explicit "*" grant.
        system:
          readOnly: true
          type: boolean
          description: |-
            True when this key is managed by the system (i.e. the auto-provisioned
             global account key). System keys cannot be deleted but can be rotated.
      description: Configuration for an API key.
    Account:
      required:
        - metadata
        - spec
        - info
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/AccountResourceMetadata'
        spec:
          $ref: '#/components/schemas/AccountSpec'
        info:
          $ref: '#/components/schemas/AccountInfo'
      description: |-
        An account, the top-level organizational unit. Contains workspaces and
         account-wide settings such as the webhook signing secret.
    AccountInfo:
      required:
        - webhookEventsHmacSecret
        - challengeToken
      type: object
      properties:
        webhookEventsHmacSecret:
          readOnly: true
          type: string
          description: |-
            The generated secret that will sign all webhooks that are sent to your configured Webhook URL.
             Formatted as "wh_asdf1234" per the https://www.standardwebhooks.com/ format.
        challengeToken:
          readOnly: true
          type: string
          description: |-
            The challenge token Cadenya sends in the X-Cadenya-Challenge-Token header
             on every MCP tools/list request. Server implementations can accept a valid
             challenge token in place of per-user auth when listing tools, while still
             requiring real auth on tools/call. Rotate with RotateChallengeToken; update
             any servers validating the token before rotating.
      description: Server-populated information about the account.
    AccountResourceMetadata:
      required:
        - id
        - accountId
        - name
        - profileId
        - externalId
        - labels
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier for the resource (prefixed ULID, e.g., "apikey_01HXK...")
        accountId:
          readOnly: true
          example: account_01HXKD2E5NQM3T9AYWCFTJHJVF
          type: string
          description: Account this resource belongs to for multi-tenant isolation (prefixed ULID)
        name:
          type: string
          description: |-
            Human-readable name for the resource (e.g., "Customer Support Agent", "Email Tool")
             Required for resources that users interact with directly
        externalId:
          type: string
          description: External ID for the resource (e.g., a workflow ID from an external system)
        labels:
          type: object
          additionalProperties:
            type: string
          description: |-
            Key-value pairs for categorization and filtering. Values are 0-63
             alphanumeric characters with "-", "_", or "." allowed between; keys
             follow the same shape and additionally accept an optional DNS-subdomain
             prefix (e.g. "cadenya.com/") of at most 253 characters.
             Examples: {"environment": "production", "team": "platform", "version": "v2"}
        profileId:
          readOnly: true
          example: profile_01HXKD2E5NQM3T9AYWCFS0AP08
          type: string
        createdAt:
          readOnly: true
          type: string
          format: date-time
      description: AccountResourceMetadata is used to represent a resource that is associated to an account but not to a workspace.
    AccountSpec:
      required:
        - description
        - domain
        - billingEmail
        - workspaces
      type: object
      properties:
        description:
          type: string
        domain:
          type: string
        billingEmail:
          type: string
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
      description: Configuration for an account.
    AddAgentVariationAssignmentRequest:
      oneOf:
        - $ref: '#/components/schemas/AddAgentVariationAssignmentRequest_ToolId'
        - $ref: '#/components/schemas/AddAgentVariationAssignmentRequest_ToolSetId'
        - $ref: '#/components/schemas/AddAgentVariationAssignmentRequest_SubAgentId'
      discriminator:
        propertyName: type
        mapping:
          toolId: '#/components/schemas/AddAgentVariationAssignmentRequest_ToolId'
          toolSetId: '#/components/schemas/AddAgentVariationAssignmentRequest_ToolSetId'
          subAgentId: '#/components/schemas/AddAgentVariationAssignmentRequest_SubAgentId'
      description: |-
        Attach a single tool, tool set, or sub-agent to a variation. Exactly one
         of the target fields must be set; the assignment kind is inferred from the
         populated field.
    AddAgentVariationMemoryLayerRequest:
      required:
        - memoryLayerId
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        agentId:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
        variationId:
          readOnly: true
          example: agentvar_01HXKD2E5NQM3T9AYWCF32BSPP
          type: string
          description: Variation ID. Accepts the canonical `agentvar_…` form or the `external_id:<value>` form.
        memoryLayerId:
          example: memlyr_01HXKD2E5NQM3T9AYWCFFFBMJH
          type: string
          description: Layer to attach. Accepts the canonical `memlyr_…` form or the `external_id:<value>` form.
        position:
          type: integer
          description: |-
            Position in the baseline cascade (lower = more specific). If
             omitted, the server appends at the most general end (max existing
             position + 1).
          format: int32
      description: |-
        Attach a memory layer to a variation. The request is rejected when:
           - the layer is system-managed (FailedPrecondition)
           - the layer is already assigned to this variation (AlreadyExists)
           - the variation is already at the 10-assignment cap (FailedPrecondition)
           - the position is already in use on this variation (InvalidArgument)
    AddWorkspaceMemberRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: The workspace to add the member to (path).
        profileId:
          example: profile_01HXKD2E5NQM3T9AYWCFS0AP08
          type: string
          description: An existing account profile to add. Mutually exclusive with email.
        email:
          type: string
          description: Email address to add (resolve-or-invite). Mutually exclusive with profile_id.
      description: |-
        AddWorkspaceMemberRequest grants a profile access to a workspace. Provide
         exactly one of profile_id (an existing account profile) or email. When email
         is given, the backend resolves it to an existing account profile or invites a
         new one before linking it to the workspace via an actor.
    Agent:
      required:
        - metadata
        - spec
        - state
        - info
      type: object
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Resource metadata
        spec:
          allOf:
            - $ref: '#/components/schemas/AgentSpec'
          description: Agent specification
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AgentInfo'
          description: Agent information
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - STATE_DRAFT
            - STATE_PUBLISHED
            - STATE_ARCHIVED
          type: string
          description: |-
            The current lifecycle state of the agent. Output only. Agents are created
             in STATE_DRAFT; use the :publish, :unpublish, :archive, and :unarchive
             actions to transition between states.
          format: enum
      description: Agent resource
    AgentInfo:
      required:
        - variationCount
      type: object
      properties:
        variationCount:
          readOnly: true
          type: integer
          format: int32
        createdBy:
          $ref: '#/components/schemas/Profile'
      description: AgentInfo contains simple information about an agent for display or quick reference
    AgentSchedule:
      required:
        - metadata
        - spec
        - state
        - info
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/AgentScheduleSpec'
        info:
          $ref: '#/components/schemas/AgentScheduleInfo'
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - STATE_ACTIVE
            - STATE_PAUSED
            - STATE_ARCHIVED
          type: string
          description: |-
            The current lifecycle state of the schedule. Output only. Schedules are
             created STATE_ACTIVE; use the :pause, :resume, and :archive actions to
             transition between states.
          format: enum
      description: |-
        AgentSchedule resource — a recurring trigger attached to an agent that
         creates objectives on its cadence.
    AgentScheduleInfo:
      required:
        - totalFires
      type: object
      properties:
        nextFireAt:
          readOnly: true
          type: string
          description: |-
            When the schedule will next fire. Computed from the spec; absent when
             the schedule is STATE_PAUSED/STATE_ARCHIVED or has no future fire times.
          format: date-time
        lastFireAt:
          readOnly: true
          type: string
          description: When the schedule last fired (regardless of objective outcome).
          format: date-time
        lastObjectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: ID of the most recent objective the schedule created.
        lastSkippedAt:
          readOnly: true
          type: string
          description: When the schedule most recently skipped a fire (SKIP policy + prior in flight).
          format: date-time
        lastSkipReason:
          readOnly: true
          type: string
          description: Reason for the most recent skip (e.g. "previous objective still running").
        totalFires:
          readOnly: true
          type: integer
          description: Lifetime count of objectives created by this schedule.
          format: int32
        createdBy:
          $ref: '#/components/schemas/Profile'
      description: AgentScheduleInfo provides read-only runtime data about a schedule.
    AgentScheduleSpec:
      required:
        - schedule
      type: object
      properties:
        schedule:
          allOf:
            - $ref: '#/components/schemas/AgentScheduleSpec_Schedule'
          description: When to fire. Required.
        overlapPolicy:
          enum:
            - OVERLAP_POLICY_UNSPECIFIED
            - OVERLAP_POLICY_ALLOW
            - OVERLAP_POLICY_SKIP
          type: string
          description: What to do when the previous run is still in flight. Defaults to SKIP.
          format: enum
        firstUserMessage:
          type: string
          description: |-
            Optional explicit first user message passed to CreateObjective on each fire.
             Becomes the first user message in the objective's chat history. When unset, the
             fired objective defers to the selected variation's first_user_message_template.
        variationId:
          example: agentvar_01HXKD2E5NQM3T9AYWCF32BSPP
          type: string
          description: |-
            Optional explicit variation. When unset, the agent's variation_selection_mode
             chooses per fire.
        systemPromptData:
          type: object
          description: |-
            Optional data rendered into the variation's system_prompt_template when each
             fired objective is created. If the agent has a system_prompt_data_schema,
             this must satisfy it.
          x-cadenyaapi-any: true
        firstUserMessageData:
          type: object
          description: |-
            Optional data rendered into the variation's first_user_message_template when
             each fired objective is created. Separate from `system_prompt_data`, which
             renders the system prompt template.
          x-cadenyaapi-any: true
      description: AgentScheduleSpec is the user-provided configuration for a schedule.
    AgentScheduleSpec_Schedule:
      type: object
      properties:
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Schedule_Calendar'
          description: Wall-clock rules. May be empty if `intervals` is non-empty.
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/Schedule_Interval'
          description: Duration-based rules. May be empty if `calendars` is non-empty.
        timezone:
          type: string
          description: |-
            IANA tz name (e.g. "America/New_York"). Required. Applies to calendars;
             intervals fire on wall-clock cadence anchored in this zone.
      description: |-
        Schedule defines WHEN the schedule fires. Temporal-style structured form:
         a list of calendar rules (wall-clock) and/or interval rules (duration),
         OR'd together. At least one rule is required.
    AgentSpec:
      required:
        - variationSelectionMode
      type: object
      properties:
        description:
          type: string
          description: Description of the agent's purpose
        webhookEventsUrl:
          type: string
          description: The URL that Cadenya will send events for any objective assigned to the agent.
        variationSelectionMode:
          enum:
            - VARIATION_SELECTION_MODE_UNSPECIFIED
            - VARIATION_SELECTION_MODE_RANDOM
            - VARIATION_SELECTION_MODE_WEIGHTED
          type: string
          description: |-
            Controls how variations are automatically selected when creating objectives
             Defaults to RANDOM when unspecified
          format: enum
        systemPromptDataSchema:
          type: object
          additionalProperties: true
          description: |-
            SystemPromptDataSchema enforces the shape of system_prompt_data when objectives are created. This is valuable when using liquid formatting in agent
             variation system prompt templates. The schema is also used when the agent is attached as a sub-agent, as it becomes the tool's input parameter schema.
             If omitted, the sub-agent schema will be loaded with a simple "prompt" free text string as its schema.
        outputDefinition:
          type: object
          additionalProperties: true
          description: |-
            Optional output definition for objectives created for this agent.
             When provided, Cadenya will append a tool to that will be called by the LLM in use by the variant to extract information in the format provided here.
             Use this option when you want structured data to be created by your objectives.
        enableEpisodicMemory:
          type: boolean
          description: |-
            Enable episodic memory for objectives created for this agent.
             When true, objective creation requires an episodic_memory key and the
             system finds or creates a memory layer for that (agent, key) pair, letting
             the agent store and retrieve memories across objectives that share the key.
             Memory is agent-level so all variations of the agent share the same layers.
        episodicMemoryTtl:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: integer
          description: |-
            How long episodic memories should be retained.
             Each new objective slides the layer's expiry forward by this duration, and
             stored entries expire this long after they are written.
             If not set, episodic memories are retained indefinitely.
      description: Agent specification (user-provided configuration)
    AgentVariation:
      required:
        - metadata
        - spec
        - info
      type: object
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Resource metadata
        spec:
          allOf:
            - $ref: '#/components/schemas/AgentVariationSpec'
          description: Variation specification
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AgentVariationInfo'
          description: Read-only summary information
      description: AgentVariation resource
    AgentVariationInfo:
      required:
        - toolCount
        - toolSetCount
        - subAgentCount
        - score
        - feedbackCount
        - assignments
        - memoryLayerAssignments
        - memoryLayerCount
      type: object
      properties:
        toolCount:
          readOnly: true
          type: integer
          description: Number of individual tools assigned to this variation
          format: int32
        toolSetCount:
          readOnly: true
          type: integer
          description: Number of tool sets assigned to this variation
          format: int32
        subAgentCount:
          readOnly: true
          type: integer
          description: Number of sub-agents assigned to this variation
          format: int32
        createdBy:
          $ref: '#/components/schemas/Profile'
        model:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Metadata for the model assigned to this variation
        score:
          type: number
          description: |-
            Thompson Sampling score: posterior mean of Beta(ts_alpha, ts_beta).
             Range [0, 1] where 0.5 = neutral, >0.5 = positive, <0.5 = negative.
          format: float
        feedbackCount:
          type: integer
          description: Total number of objective feedbacks received for this variation
          format: int32
        assignments:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/VariationAssignment'
          description: |-
            All tools, tool sets, and sub-agents assigned to this variation.
             Populated on reads so clients can render a variation's full assignment
             list without calling the add/remove endpoints just to enumerate.
        memoryLayerAssignments:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/VariationMemoryLayerAssignment'
          description: |-
            Read-only list of memory layer assignments for this variation,
             returned in ascending `position` (most specific first — resolution
             order). Capped at 10 entries.
        memoryLayerCount:
          readOnly: true
          type: integer
          description: Count of memory layer assignments.
          format: int32
      description: AgentVariationInfo provides read-only summary information about a variation
    AgentVariationSpec:
      type: object
      properties:
        systemPromptTemplate:
          type: string
          description: |-
            Liquid template for the system prompt of objectives using this variation.
             Rendered with CreateObjectiveRequest.system_prompt_data into Objective.system_prompt.
        progressiveDiscovery:
          allOf:
            - $ref: '#/components/schemas/AgentVariationSpec_ProgressiveDiscovery'
          description: |-
            ProgressiveDiscovery is an optional config that, when set, will load a Cadenya provided tool that
             can search for tools in the assigned tool sets or tools.

             Note: Sub-agents are always loaded as a tool regardless of this value.
        constraints:
          allOf:
            - $ref: '#/components/schemas/AgentVariationSpec_Constraints'
          description: Execution constraints
        description:
          type: string
          description: Human-readable description of what this variation does or when it should be used
        modelConfig:
          allOf:
            - $ref: '#/components/schemas/AgentVariationSpec_ModelConfig'
          description: Model configuration for this variation
        compactionConfig:
          allOf:
            - $ref: '#/components/schemas/AgentVariationSpec_CompactionConfig'
          description: |-
            Compaction configuration for managing context window limits during long-running objectives.
             When not set, the system uses a default summarization strategy at 75% context window usage.
        firstUserMessageTemplate:
          type: string
          description: |-
            Liquid template for the first user message of objectives using this variation.
             Rendered with CreateObjectiveRequest.first_user_message_data into
             Objective.first_user_message, the first user message in the LLM chat history.
             CreateObjectiveRequest.first_user_message, when set, overrides the rendered
             result. If neither this template nor first_user_message is present, objective
             creation is rejected with InvalidArgument.
      description: AgentVariationSpec defines the operational configuration for a variation
    AgentVariationSpec_CompactionConfig:
      type: object
      properties:
        triggerThreshold:
          type: number
          description: |-
            Trigger threshold as a percentage of the model's context window (0.0 to 1.0).
             When input tokens reach this percentage of the model's limit, compaction triggers.
             Default: 0.75 (75%)
          format: float
        summarization:
          allOf:
            - $ref: '#/components/schemas/CompactionConfig_SummarizationStrategy'
          description: |-
            Strategies — set one or more. When multiple are set, they execute in order:
             tool_result_clearing → summarization.
             When none are set, defaults to summarization with the system default prompt.
        toolResultClearing:
          $ref: '#/components/schemas/CompactionConfig_ToolResultClearingStrategy'
      description: CompactionConfig defines how context window compaction behaves for objectives using this variation.
    AgentVariationSpec_Constraints:
      type: object
      properties:
        maxToolCalls:
          type: integer
          description: The maximum number of tool calls that can be made. 0 means no limit.
          format: int32
        maxSubObjectives:
          type: integer
          description: The maximum number of sub-objectives that can be created. 0 means no limit.
          format: int32
        inactivityTimeout:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: |-
            How long an objective may sit with no activity (no user messages, no
             LLM calls) before it is finalized as timed out. Between 1 minute and
             24 hours, expressed as a duration string in seconds (e.g. "7200s").
             When not set, objectives are still swept at the system-wide 24 hour
             maximum — every objective eventually reaches a terminal state.

             Note: no gnostic integer hint here on purpose. The Envoy gRPC-JSON
             transcoder only accepts the canonical protobuf JSON form for
             Durations — a "<seconds>s" string — so the SDKs must type this as a
             string (like AgentScheduleSpec.every), not an integer.
    AgentVariationSpec_ModelConfig:
      required:
        - modelId
      type: object
      properties:
        modelId:
          example: claude/opus-4.6
          type: string
          description: The model identifier in family/model format (e.g., "claude/opus-4.6", "claude/sonnet-4.5")
        temperature:
          type: number
          description: |-
            Sampling temperature for model inference (0.0 to 1.0)
             Lower values produce more deterministic outputs, higher values increase randomness.
             Presence-tracked so a deliberate 0.0 (fully deterministic) is
             distinguishable from unset.
          format: float
        topP:
          type: number
          description: |-
            Nucleus sampling: only tokens comprising the top_p probability mass
             are considered. Requires the model's "topP" capability.
          format: float
        topK:
          type: integer
          description: |-
            Only sample from the top_k most likely tokens.
             Requires the model's "topK" capability.
          format: int32
        stopSequences:
          type: array
          items:
            type: string
          description: |-
            Sequences that stop generation when produced. Empty means none.
             No count cap here — providers impose their own limits (surfaced as
             the "stopSequences" capability's `limit` on the model spec), and it
             is the caller's responsibility to stay within the selected model's
             limit. Requires the model's "stopSequences" capability.
        maxOutputTokens:
          type: integer
          description: |-
            Cap on output tokens per LLM call. Must not exceed the model's
             spec.max_output_tokens. Requires the model's "maxOutputTokens"
             capability.
          format: int32
        reasoningEffort:
          enum:
            - REASONING_EFFORT_UNSPECIFIED
            - REASONING_EFFORT_NONE
            - REASONING_EFFORT_LOW
            - REASONING_EFFORT_MEDIUM
            - REASONING_EFFORT_HIGH
          type: string
          description: Reasoning effort. Requires the model's "reasoning" capability.
          format: enum
        cachingEnabled:
          type: boolean
          description: |-
            Prompt/token caching. Requires the model's "caching" capability.
             Presence-tracked tri-state: unset means the default — caching is ON
             whenever the model has the capability; false opts this variation
             out; true is an explicit opt-in (equivalent to unset).
      description: |-
        ModelConfig defines the model configuration for a variation.

         Every knob besides model_id is honored only when the assigned model's
         spec.capabilities lists the matching capability.
    AgentVariationSpec_ProgressiveDiscovery:
      type: object
      properties:
        maxTools:
          type: integer
          description: |-
            The most tool names tool_search will load in a single call. Requesting more
             than this returns an error telling the model to retry in smaller batches --
             it is a per-call batch limit, not a ceiling on how many tools an objective
             may end up with.
          format: int32
        hints:
          type: array
          items:
            type: string
          description: |-
            Free-text guidance appended to the discoverable-tools appendix in the
             system prompt. Hints steer the model's choice of tool names; they do not
             filter or rank anything, because tool_search matches names exactly rather
             than searching.
      description: |-
        ProgressiveDiscovery is used to indicate that the agent should automatically discover tools that are not explicitly assigned to it.
         Max tools is the maximum number of tools that can be discovered per search.
         Hints are optional hints for tool search. These are used in conjunction with the context-aware tool search and can help select the best tools for the task.
    ApproveToolCallRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
        objectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: The ID of the objective. Supports "external_id:" prefix for external IDs.
        toolCallId:
          readOnly: true
          example: toolcall_01HXKD2E5NQM3T9AYWCFTANFGV
          type: string
          description: The ID of the tool call to approve
    ArchiveAgentRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
      description: Archive agent request
    ArchiveAgentScheduleRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        agentId:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
        id:
          readOnly: true
          example: as_01HXKD2E5NQM3T9AYWCFMZZZBD
          type: string
          description: Schedule ID. Accepts the canonical `as_…` form or the `external_id:<value>` form.
      description: Archive agent schedule request.
    ArchiveToolSetRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: toolset_01HXKD2E5NQM3T9AYWCFNRMN74
          type: string
          description: |-
            Tool set ID. Accepts the canonical ts_… form or the
             external_id:<value> form.
      description: Archive tool set request
    ArchiveWidgetRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: wgt_01HXKD2E5NQM3T9AYWCFMZZZBD
          type: string
          description: Widget ID. Accepts the canonical `wgt_…` form or the `external_id:<value>` form.
      description: Archive widget request.
    AssistantMessage:
      required:
        - toolCalls
      type: object
      properties:
        content:
          type: string
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/AssistantToolCall'
    AssistantToolCall:
      required:
        - arguments
        - functionName
      type: object
      properties:
        tool:
          $ref: '#/components/schemas/CallableTool'
        arguments:
          type: string
        functionName:
          type: string
    BareMetadata:
      required:
        - id
      type: object
      properties:
        id:
          readOnly: true
          type: string
        name:
          readOnly: true
          type: string
          description: |-
            Human-readable name of the referenced resource, populated by the server
             on reads for convenience. Absent on references to resources that do not
             have a name (e.g., objective tasks).
      description: |-
        BareMetadata contains the minimal metadata for a resource: the ID and an
         optional human-readable name. These are used for reference fields where the
         full metadata (account scoping, timestamps, labels, external IDs) is not
         needed — e.g., the tool references inside an agent variation spec or the
         tools assigned to an objective. Both fields are server-populated; clients
         provide IDs through sibling fields rather than by constructing a
         BareMetadata themselves.
    CallableTool:
      oneOf:
        - $ref: '#/components/schemas/CallableTool_Tool'
        - $ref: '#/components/schemas/CallableTool_Agent'
        - $ref: '#/components/schemas/CallableTool_CadenyaProvidedTool'
      discriminator:
        propertyName: type
        mapping:
          tool: '#/components/schemas/CallableTool_Tool'
          agent: '#/components/schemas/CallableTool_Agent'
          cadenyaProvidedTool: '#/components/schemas/CallableTool_CadenyaProvidedTool'
      description: |-
        CallableTool is a union that represents a tool that can be called by an agent. In Cadenya, a tool that is used within an agent objective
         might be a user-defined tool (IE: MCP, HTTP), another Agent (useful to separate context), or a Cadenya Tool (one Cadenya provides).
    CancelObjectiveRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
        objectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: The ID of the objective. Supports "external_id:" prefix for external IDs.
        reason:
          type: string
          description: Optional reason for cancellation
    Capability_Caching:
      type: object
      properties: {}
      description: |-
        Prompt/token caching (ModelConfig.caching_enabled). A model that
         cannot cache prompt prefixes simply omits this capability. When the
         capability is present, caching defaults to ON — a variation opts out
         by setting caching_enabled to false.
    Capability_MaxOutputTokens:
      type: object
      properties: {}
      description: |-
        Per-request output token cap (ModelConfig.max_output_tokens).
         The effective ceiling is ModelSpec.max_output_tokens.
    Capability_Reasoning:
      required:
        - mode
      type: object
      properties:
        mode:
          enum:
            - MODE_UNSPECIFIED
            - MODE_ADAPTIVE
            - MODE_BUDGET
          type: string
          description: |-
            How reasoning is enabled for this model. Catalog data used to decide
             whether thinking is requested for objective iterations on this model.
          format: enum
      description: |-
        Reasoning / extended thinking (ModelConfig.reasoning_effort). A model
         that does not reason simply omits this capability.
    Capability_StopSequences:
      required:
        - limit
      type: object
      properties:
        limit:
          type: integer
          description: |-
            Maximum number of stop sequences the model accepts per request.
             0 means the provider imposes no meaningful limit.
          format: int32
      description: Custom stop sequences (ModelConfig.stop_sequences).
    Capability_Temperature:
      type: object
      properties: {}
      description: Sampling temperature (ModelConfig.temperature).
    Capability_TopK:
      type: object
      properties: {}
      description: Top-k sampling (ModelConfig.top_k).
    Capability_TopP:
      type: object
      properties: {}
      description: Nucleus sampling (ModelConfig.top_p).
    CompactObjectiveRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
        objectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: The ID of the objective. Supports "external_id:" prefix for external IDs.
        compactionConfig:
          allOf:
            - $ref: '#/components/schemas/AgentVariationSpec_CompactionConfig'
          description: Optional compaction config override. When not set, uses the variation's compaction_config.
      description: Compact objective request — triggers compaction on a running objective.
    CompactObjectiveResponse:
      type: object
      properties:
        contextWindow:
          allOf:
            - $ref: '#/components/schemas/ObjectiveContextWindowData'
          description: The new context window created by the compaction
      description: Compact objective response
    CompactionConfig_SummarizationStrategy:
      type: object
      properties:
        instructions:
          type: string
          description: |-
            Custom instructions that guide what the summarizer preserves.
             Replaces the default summarization prompt entirely.
             Example: "Preserve all code snippets, variable names, and technical decisions."
      description: SummarizationStrategy configures LLM-powered summarization of older conversation turns.
    CompactionConfig_ToolResultClearingStrategy:
      type: object
      properties:
        preserveRecentResults:
          type: integer
          description: |-
            Number of most recent tool call results to keep intact.
             Older tool results have their content replaced with "[result cleared]"
             while preserving the assistant tool call message (function name, arguments).
             Default: 2
          format: int32
      description: ToolResultClearingStrategy configures clearing of older tool result content.
    Config_Bare:
      type: object
      properties:
        alwaysSetResult:
          type: string
          description: |-
            When set, the tool call's result is recorded immediately as this
             fixed text instead of parking the call to wait for externally
             supplied content. The tool_called event is still emitted. Useful for
             tools whose dispatch is the intent (e.g. a frontend renders a
             component from the call parameters) but whose LLM turn still needs
             tool-result content.
      description: |-
        Marks the tool as bare: it has no execution adapter of its own and
         relies on the parent tool set being a Bare tool set. Present so a
         webhook consumer can tell a tool is bare from the tool data alone,
         without cross-referencing the tool set.
    Config_HTTP:
      required:
        - requestMethod
      type: object
      properties:
        requestMethod:
          enum:
            - HTTP_METHOD_UNSPECIFIED
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          type: string
          format: enum
        path:
          type: string
        query:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        requestBodyTemplate:
          type: string
          description: These are only used when the request method is a POST, PUT, or PATCH
        requestBodyContentType:
          type: string
    Config_MCP:
      type: object
      properties:
        annotations:
          allOf:
            - $ref: '#/components/schemas/MCP_Annotations'
          description: Tool behavior annotations from the MCP server, captured during sync.
    Config_OpenAPI:
      type: object
      properties:
        path:
          type: string
        method:
          type: string
    ContextLengths:
      required:
        - systemPrompt
        - skillsMemory
        - episodicMemory
        - availableTools
        - toolDefinitions
        - userMessages
        - assistantMessages
        - toolResults
      type: object
      properties:
        systemPrompt:
          readOnly: true
          type: integer
          description: |-
            Character length of the objective's base system prompt (rendered variation
             template). Not tokens -- see the message comment.
          format: int32
        skillsMemory:
          readOnly: true
          type: integer
          description: Character length of the skills memory appendix attached to the system prompt.
          format: int32
        episodicMemory:
          readOnly: true
          type: integer
          description: Character length of the episodic memory appendix attached to the system prompt.
          format: int32
        availableTools:
          readOnly: true
          type: integer
          description: |-
            Character length of the discoverable/available-tools appendix attached to the
             system prompt.
          format: int32
        toolDefinitions:
          readOnly: true
          type: integer
          description: |-
            Character length of the serialized tool definitions sent with the completion
             request (names, descriptions, and JSON-schema parameters).
          format: int32
        userMessages:
          readOnly: true
          type: integer
          description: Character length of the chat history messages with the user role.
          format: int32
        assistantMessages:
          readOnly: true
          type: integer
          description: Character length of the chat history messages with the assistant role.
          format: int32
        toolResults:
          readOnly: true
          type: integer
          description: Character length of the tool results present in the chat history.
          format: int32
      description: |-
        ContextLengths is the measured character length of each distinct component
         of an iteration's assembled context window. Values are raw character
         lengths of the component as assembled into the request — token estimates
         are derived by the client against input_tokens (component share =
         component length / sum of all lengths).

         New components are added as new fields — wire-compatible; absent
         components read as 0.
    ContextWindowCompacted:
      required:
        - strategies
        - messagesCompacted
        - newContextWindow
      type: object
      properties:
        newContextWindow:
          allOf:
            - $ref: '#/components/schemas/ObjectiveContextWindowData'
          description: The new context window created by this compaction
        strategies:
          type: array
          items:
            type: string
          description: The strategies that were applied during this compaction
        messagesCompacted:
          type: integer
          description: Number of messages that were compacted
          format: int32
        summary:
          type: string
          description: The summary generated by the summarization strategy, if used.
    ContinueObjectiveRequest:
      required:
        - message
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
        objectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: The ID of the objective. If you have assigned an external ID to the objective, you can prefix the ID with "external_id:". For example, "external_id:1234567890". Otherwise, the ID assigned by Cadenya should be used.
        message:
          type: string
          description: The message to continue an objective that has completed (or you are enqueing)
        enqueue:
          type: boolean
          description: When set to true, the message will be enqueued for when the agent loop is available to process it.
    CreateAIProviderKeyRequest:
      required:
        - metadata
        - spec
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: The workspace that will own this key.
        metadata:
          $ref: '#/components/schemas/CreateResourceMetadata'
        spec:
          $ref: '#/components/schemas/AIProviderKeySpec'
    CreateAPIKeyRequest:
      required:
        - metadata
        - spec
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/CreateAccountResourceMetadata'
        spec:
          $ref: '#/components/schemas/APIKeySpec'
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: The workspace this API key belongs to (path).
    CreateAccountResourceMetadata:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: Human-readable name for the resource (e.g., "Production API Key", "Staging Workspace")
        externalId:
          type: string
          description: External ID for the resource (e.g., a workflow ID from an external system)
        labels:
          type: object
          additionalProperties:
            type: string
          description: |-
            Key-value pairs for categorization and filtering. Values are 0-63
             alphanumeric characters with "-", "_", or "." allowed between; keys
             follow the same shape and additionally accept an optional DNS-subdomain
             prefix (e.g. "cadenya.com/") of at most 253 characters.
             Examples: {"environment": "production", "team": "platform", "version": "v2"}
      description: |-
        CreateAccountResourceMetadata contains the user-provided fields for creating
