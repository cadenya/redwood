          in: query
          description: Filter by tool name (exact match). Multiple values are OR'd together.
          schema:
            type: array
            items:
              type: string
        - name: states
          in: query
          description: Filter by tool state. Multiple values are OR'd together.
          schema:
            type: array
            items:
              enum:
                - STATE_UNSPECIFIED
                - STATE_AVAILABLE
                - STATE_OMITTED
                - STATE_ARCHIVED
              type: string
              format: enum
        - name: requiresApproval
          in: query
          description: |-
