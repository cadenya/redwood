openapi: 3.1.0
info:
  title: Cadenya API
  description: API for the Cadenya Agent Runtime platform.
  version: '1.0'
servers:
  - url: https://api.cadenya.com
    description: Production server
paths:
  /v1/account:
    get:
      tags:
        - AccountService
        - Accounts
      summary: Retrieves the current account for the token accessing the API
      description: Retrieves the current account for the token accessing the API. Useful to check if the credentials are valid.
      operationId: AccountService_GetAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/global_api_key:
    get:
      tags:
        - GlobalAPIKeyService
        - API Keys
      summary: Get the global API key
      description: Retrieves the account's global API key. The token is included only when the caller's scopes dominate the key's.
      operationId: GlobalAPIKeyService_GetGlobalAPIKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/global_api_key:disable:
    post:
      tags:
        - GlobalAPIKeyService
        - API Keys
      summary: Disable the global API key
      description: Disables the global API key. While disabled, presenting its token fails authentication on every endpoint; the key is retained. Idempotent.
      operationId: GlobalAPIKeyService_DisableGlobalAPIKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/global_api_key:enable:
    post:
      tags:
        - GlobalAPIKeyService
        - API Keys
      summary: Enable the global API key
      description: Re-enables the disabled global API key so its token authenticates again. Idempotent.
      operationId: GlobalAPIKeyService_EnableGlobalAPIKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/global_api_key:rotate:
    post:
      tags:
        - GlobalAPIKeyService
        - API Keys
      summary: Rotate the global API key
      description: Rotates the global API key and returns a new token. All previous tokens are invalidated.
      operationId: GlobalAPIKeyService_RotateGlobalAPIKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/profiles:
    get:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Search account profiles
      description: Searches the account's profiles for a member picker, with free-form name/email search and an optional type filter. Account-scoped; admin only.
      operationId: WorkspaceAdminService_ListProfiles
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: query
          in: query
          description: |-
            Free-form search over profile name and email. Case-insensitive substring
             match; empty returns all profiles.
          schema:
            type: string
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProfilesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/workspaces:
    get:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: List all workspaces in the account
      description: Lists every workspace in the account, optionally including archived ones. Admin only.
      operationId: WorkspaceAdminService_ListAccountWorkspaces
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: includeArchived
          in: query
          description: |-
            When true, archived workspaces are included in the results. Defaults to
             false (active workspaces only).
          schema:
            type: boolean
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountWorkspacesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Create a workspace
      description: Creates a new workspace in the account. Admin only.
      operationId: WorkspaceAdminService_CreateWorkspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/workspaces/{workspaceId}:
    get:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Get a workspace by ID
      description: Retrieves a workspace in the account by ID. Admin only.
      operationId: WorkspaceAdminService_GetWorkspace
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID to retrieve (path).
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Archive a workspace
      description: Archives a workspace (soft delete). The workspace is retained, but any subsequent request scoped to it returns a permission error. Archiving the account's last active (non-archived) workspace is not allowed and returns FailedPrecondition. Admin only.
      operationId: WorkspaceAdminService_ArchiveWorkspace
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID to archive (path).
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      responses:
        '200':
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    patch:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Update a workspace
      description: Updates a workspace's metadata (e.g. name) and spec. Admin only.
      operationId: WorkspaceAdminService_UpdateWorkspace
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID to update (path).
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/workspaces/{workspaceId}/members:
    get:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: List workspace members
      description: Lists the members of a workspace. Admin only.
      operationId: WorkspaceAdminService_ListWorkspaceMembers
      parameters:
        - name: workspaceId
          in: path
          description: The workspace whose members will be listed (path).
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceMembersResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Add a member to a workspace
      description: Grants a profile access to the workspace by creating (or reactivating) the actor that links the profile to the workspace. Accepts either an existing profile_id or an email to resolve-or-invite. Idempotent for an already-active member. Admin only.
      operationId: WorkspaceAdminService_AddWorkspaceMember
      parameters:
        - name: workspaceId
          in: path
          description: The workspace to add the member to (path).
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceMemberRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account/workspaces/{workspaceId}/members/{profileId}:
    delete:
      tags:
        - WorkspaceAdminService
        - Workspace Admin
      summary: Remove a member from a workspace
      description: Revokes a member's access by deactivating their actor; the member is immediately cut off. The underlying profile is not deleted. Admin only.
      operationId: WorkspaceAdminService_RemoveWorkspaceMember
      parameters:
        - name: workspaceId
          in: path
          description: The workspace to remove the member from (path).
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: profileId
          in: path
          description: The profile to remove from the workspace (path).
          required: true
          schema:
            type: string
            example: profile_01HXKD2E5NQM3T9AYWCFS0AP08
      responses:
        '200':
          description: OK
          content: {}
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account:rotateChallengeToken:
    post:
      tags:
        - AccountService
        - Accounts
      summary: Rotates the challenge token for the account
      description: Rotates the challenge token sent in the X-Cadenya-Challenge-Token header on MCP tools/list requests. Returns only the new token.
      operationId: AccountService_RotateChallengeToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateChallengeTokenResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/account:rotateWebhookSigningKey:
    post:
      tags:
        - AccountService
        - Accounts
      summary: Rotates the webhook signing key for the account
      description: Rotates the webhook signing key for the account. Returns only the new key.
      operationId: AccountService_RotateWebhookSigningKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateWebhookEventsHmacSecretResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/whoami:
    get:
      tags:
        - ProfilesService
        - Profiles
      summary: Retrieves the profile for the credentials accessing the API
      description: Retrieves the profile of the authenticated caller. Useful to check which principal a token belongs to.
      operationId: ProfilesService_Whoami
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces:
    get:
      tags:
        - WorkspaceService
        - Workspaces
      summary: List workspaces
      description: Lists all workspaces for the current account
      operationId: WorkspaceService_ListWorkspaces
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time)
          schema:
            type: string
        - name: includeInfo
          in: query
          description: When set to true you may use more of your alloted API rate-limit
          schema:
            type: boolean
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspacesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/agents:
    get:
      tags:
        - AgentService
        - Agents
      summary: List agents
      description: Lists all agents in the workspace
      operationId: AgentService_ListAgents
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: prefix
          in: query
          description: 'Filter expression (query param: prefix)'
          schema:
            type: string
        - name: query
          in: query
          description: Free-form search query
          schema:
            type: string
        - name: state
          in: query
          description: Filter by agent lifecycle state
          schema:
            enum:
              - STATE_UNSPECIFIED
              - STATE_DRAFT
              - STATE_PUBLISHED
              - STATE_ARCHIVED
            type: string
            format: enum
        - name: variationSelectionMode
          in: query
          description: Filter by variation selection mode
          schema:
            enum:
              - VARIATION_SELECTION_MODE_UNSPECIFIED
              - VARIATION_SELECTION_MODE_RANDOM
              - VARIATION_SELECTION_MODE_WEIGHTED
            type: string
            format: enum
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time)
          schema:
            type: string
        - name: includeInfo
          in: query
          description: |-
            When true, the `info` field on each returned agent is populated. Requests
             with this flag count more against your rate limit.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      tags:
        - AgentService
        - Agents
      summary: Create a new agent
      description: Creates a new agent in the workspace
      operationId: AgentService_CreateAgent
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/agents/{agentId}/feedback:
    get:
      tags:
        - AgentService
        - Agents
      summary: List feedback for an agent
      description: Lists feedback submitted across all objectives belonging to an agent. Supports search by comment, sentiment filter, agent variation filter, and creation date range. Results are ordered by creation time, newest first.
      operationId: AgentService_ListAgentFeedback
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: agentId
          in: path
          description: The ID of the agent. Supports "external_id:" prefix for external IDs.
          required: true
          schema:
            type: string
            example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response.
          schema:
            type: string
        - name: query
          in: query
          description: Free-text search applied to the feedback comment. Case-insensitive substring match.
          schema:
            type: string
        - name: sentiment
          in: query
          description: Filter by sentiment. UNSPECIFIED returns feedback regardless of score.
          schema:
            enum:
              - FEEDBACK_SENTIMENT_UNSPECIFIED
              - FEEDBACK_SENTIMENT_POSITIVE
              - FEEDBACK_SENTIMENT_NEGATIVE
            type: string
            format: enum
        - name: agentVariationId
          in: query
          description: |-
            Optional filter to limit results to feedback on objectives run by a single
             agent variation. Supports "external_id:" prefix for external IDs.
          schema:
            type: string
        - name: createdAfter
          in: query
          description: Inclusive lower bound on feedback creation time.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          description: Exclusive upper bound on feedback creation time.
          schema:
            type: string
            format: date-time
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: includeInfo
          in: query
          description: When set to true you may use more of your alloted API rate-limit
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentFeedbackResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/agents/{agentId}/schedules:
    get:
      tags:
        - AgentScheduleService
        - Agent Schedules
      summary: List schedules
      description: Lists all schedules for an agent
      operationId: AgentScheduleService_ListAgentSchedules
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: agentId
          in: path
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
          required: true
          schema:
            type: string
            example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response.
          schema:
            type: string
        - name: prefix
          in: query
          description: 'Filter expression (query param: prefix).'
          schema:
            type: string
        - name: query
          in: query
          description: Free-form search query.
          schema:
            type: string
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time).
          schema:
            type: string
        - name: includeInfo
          in: query
          description: |-
            When true, the `info` field on each returned schedule is populated.
             Requests with this flag count more against your rate limit.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentSchedulesResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      tags:
        - AgentScheduleService
        - Agent Schedules
      summary: Create a new schedule
      description: Creates a new schedule for an agent
      operationId: AgentScheduleService_CreateAgentSchedule
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: agentId
          in: path
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
          required: true
          schema:
            type: string
            example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentScheduleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSchedule'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/agents/{agentId}/schedules/{id}:
    get:
      tags:
        - AgentScheduleService
        - Agent Schedules
      summary: Get a schedule by ID
      description: Retrieves a schedule by ID from an agent
      operationId: AgentScheduleService_GetAgentSchedule
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: agentId
          in: path
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
          required: true
          schema:
            type: string
            example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
        - name: id
          in: path
          description: Schedule ID. Accepts the canonical `as_…` form or the `external_id:<value>` form.
          required: true
          schema:
            type: string
            example: as_01HXKD2E5NQM3T9AYWCFMZZZBD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSchedule'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      tags:
        - AgentScheduleService
        - Agent Schedules
      summary: Delete a schedule
