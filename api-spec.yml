  /v1/workspaces/{workspaceId}/tenants:
    get:
      tags:
        - TenantService
        - Tenants
      summary: List tenants
      description: Lists the tenants asserted in a workspace, newest first. `query` matches against a tenant's name and its external_id, for type-ahead filters.
      operationId: TenantService_ListTenants
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response.
          schema:
            type: string
        - name: query
          in: query
          description: |-
            Substring match against the tenant's name and external_id. Built for
             type-ahead filter pickers, where the operator knows the customer's own
             identifier rather than Cadenya's.
          schema:
            type: string
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time).
          schema:
            type: string
        - name: includeInfo
          in: query
          description: |-
            When true, the `info` field on each returned tenant is populated. This
             costs several count queries per tenant, so it is off by default.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/workspaces/{workspaceId}/tenants/{id}:
    get:
      tags:
        - TenantService
        - Tenants
      summary: Get a tenant by ID
      description: Retrieves a tenant by its canonical id or by the `external_id:<value>` form the customer asserted it under.
      operationId: TenantService_GetTenant
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: id
          in: path
          description: |-
            Tenant ID. Accepts the canonical `tenant_…` form or the
             `external_id:<value>` form.
          required: true
          schema:
            type: string
        - name: includeInfo
          in: query
          description: When true, the `info` field is populated.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      tags:
        - TenantService
        - Tenants
      summary: Erase a tenant
      description: 'Destroys the tenant, its subjects, every objective associated with it and everything reachable from those objectives, and its widget sessions. This is the full erasure hammer, wider than `DELETE /widget_sessions`, which removes only what widget sessions created. The work runs in the background: this returns the tenant in STATE_ERASING rather than a count of what was removed, since a large tenant''s history cannot be destroyed inside a request. Poll the tenant to follow it — STATE_ERASING while it runs, NotFound once it finishes. Erasure is terminal; a tenant cannot be recovered once it starts.'
      operationId: TenantService_DeleteTenant
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
