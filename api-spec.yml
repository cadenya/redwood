          $ref: '#/components/schemas/Page'
    ListWorkspacesResponse:
      required:
        - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        pagination:
          $ref: '#/components/schemas/Page'
    MCP_Annotations:
      type: object
      properties:
        title:
          type: string
          description: A human-readable title for the tool.
        readOnlyHint:
          type: boolean
          description: If true, the tool does not modify its environment.
        destructiveHint:
          type: boolean
          description: |-
            If true, the tool may perform destructive updates to its environment.
             Only meaningful when read_only_hint is false.
        idempotentHint:
          type: boolean
          description: |-
            If true, calling the tool repeatedly with the same arguments has no
             additional effect. Only meaningful when read_only_hint is false.
        openWorldHint:
          type: boolean
          description: |-
            If true, the tool may interact with an "open world" of external
             entities (e.g. web search); if false, its domain is closed.
      description: |-
        Behavior hints synced from the MCP server's tool definition
         (ToolAnnotations in the MCP specification). All hints are advisory:
         servers are not required to send them, and clients should not rely
         on them for security decisions. Absent hints keep the MCP spec
         defaults (destructiveHint and openWorldHint default to true;
         readOnlyHint and idempotentHint default to false).
    MemoryEntry:
      required:
        - metadata
        - spec
        - info
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/MemoryEntrySpec'
        info:
          $ref: '#/components/schemas/MemoryEntryInfo'
      description: |-
        MemoryEntry is a single keyed value within a MemoryLayer. Entries are
         addressed by their key, which follows the S3 object key safe-character
         convention (see MemoryEntrySpec.key for the full rule). Keys are unique
         within a single layer; the same key may appear in multiple layers, in which
         case the cascade walk determines which one wins for a given objective (most
         specific layer first).

         MemoryEntry is the summary shape, returned by ListMemoryEntries. It does
         not carry the entry body — callers that need the body must fetch the entry
         individually via GetMemoryEntry, which returns a MemoryEntryDetail.
    MemoryEntryCreateSpec:
      oneOf:
        - $ref: '#/components/schemas/MemoryEntryCreateSpec_Content'
        - $ref: '#/components/schemas/MemoryEntryCreateSpec_UploadId'
      discriminator:
        propertyName: type
        mapping:
          content: '#/components/schemas/MemoryEntryCreateSpec_Content'
          uploadId: '#/components/schemas/MemoryEntryCreateSpec_UploadId'
      description: |-
        MemoryEntryCreateSpec is the input shape for CreateMemoryEntry. It accepts
         either inline content or a reference to a completed Upload; exactly one of
         the two must be set.
    MemoryEntryDetail:
      required:
        - metadata
        - spec
        - content
        - info
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/MemoryEntrySpec'
        info:
          $ref: '#/components/schemas/MemoryEntryInfo'
        content:
          type: string
          description: |-
            The resolved body of the entry. For entries created or updated via an
             upload_id, this is the ingested content, not the original upload handle.
             May be empty; an entry with only a key and description is valid
             (e.g., a stub skill being drafted, or an entry where the frontmatter
             alone is the payload).
      description: |-
        MemoryEntryDetail is the full representation of an entry, including the
         resolved content body. Returned by GetMemoryEntry, CreateMemoryEntry, and
         UpdateMemoryEntry.
    MemoryEntryInfo:
      type: object
      properties:
        memoryLayer:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: The layer this entry belongs to.
        createdBy:
          $ref: '#/components/schemas/Profile'
    MemoryEntrySpec:
      required:
        - key
        - description
      type: object
      properties:
        key:
          type: string
          description: |-
            The lookup key for this entry within its layer. Must conform to the S3
             object key safe-characters spec: ASCII alphanumerics and the special
             characters !, -, _, ., *, ', (, ), and /. Forward slashes may be used to
             suggest hierarchy (e.g., "skills/postmortem/write"), but lookups are flat
             — the key is a single opaque string, not a path.

             Additional rules enforced by the service:
               - May not begin or end with /
               - May not contain consecutive slashes (//)
               - May not begin with reserved prefixes (cadenya/, system/)
               - Case-sensitive
               - Unique within the parent layer

             For skills entries, this key is what the model passes to get_memory to
             load the entry's content.
        description:
          type: string
          description: |-
            One-line "when to use this" hint shown in the frontmatter manifest for
             skills entries. The model uses this to decide whether to load the body,
             so it should be written for the model as the audience. Ignored for layer
             types that do not advertise frontmatter.
      description: |-
        MemoryEntrySpec is the metadata portion of an entry — the fields that
         identify and describe it, without the body. It appears on both the summary
         (MemoryEntry) and detail (MemoryEntryDetail) views.
    MemoryEntryUpdateSpec:
      type: object
      properties:
        key:
          type: string
        description:
          type: string
        content:
          type: string
        uploadId:
          example: upload_01HXKD2E5NQM3T9AYWCFZ05DNK
          type: string
      description: |-
        MemoryEntryUpdateSpec is the input shape for UpdateMemoryEntry. Fields
         present in the request's update_mask are applied; unset fields are left
         alone. The source oneof is optional for updates — omit it to leave the
         body untouched, or set exactly one branch to replace it.
    MemoryLayer:
      required:
        - metadata
        - spec
        - info
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/MemoryLayerSpec'
        info:
          $ref: '#/components/schemas/MemoryLayerInfo'
      description: |-
        MemoryLayer is a named container of memory entries that can be composed into
         an objective's memory cascade. Layers are workspace-scoped resources. The layer
         type controls how its entries participate in the agent loop — see
         MemoryLayerType for details.

         See "Memory cascade composition" above for how layers compose at lookup time.
    MemoryLayerInfo:
      required:
        - entryCount
      type: object
      properties:
        entryCount:
          readOnly: true
          type: integer
          description: Number of entries currently in this layer.
          format: int32
        createdBy:
          $ref: '#/components/schemas/Profile'
        lastUsedAt:
          readOnly: true
          type: string
          description: |-
            Timestamp of the most recent objective that resolved against this layer.
             Useful for surfacing unused layers in the dashboard.
          format: date-time
        agent:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: |-
            For episodic layers, the metadata of the agent the layer belongs to
             (resolved from MemoryLayerSpec.agent_id). Unset for non-episodic layers.
    MemoryLayerSpec:
      required:
        - type
        - systemManaged
        - agentId
        - episodicKey
      type: object
      properties:
        type:
          enum:
            - MEMORY_LAYER_TYPE_UNSPECIFIED
            - MEMORY_LAYER_TYPE_EPISODIC
            - MEMORY_LAYER_TYPE_SKILLS
          type: string
          format: enum
        description:
          type: string
          description: |-
            Human-readable description of the layer's purpose. Encouraged for
             user-created layers; system-managed layers may have a generated description.
        systemManaged:
          readOnly: true
          type: boolean
          description: |-
            Server-set. True for layers managed by the system (e.g., episodic layers
             created automatically when an objective uses an episodic_key). System-managed
             layers cannot be assigned to objective cascades via the API and cannot be
             mutated by clients — their lifecycle is controlled entirely by the runtime.
        expiresAt:
          readOnly: true
          type: string
          description: |-
            For layers with a finite lifetime (e.g., episodic), the time at which the
             layer becomes eligible for cleanup. Set by the system; unset for
             persistent layers.
          format: date-time
        agentId:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: |-
            Server-set on episodic layers: the agent this layer belongs to. Unset for
             non-episodic layers.
        episodicKey:
          readOnly: true
          type: string
          description: |-
            Server-set on episodic layers: the caller-supplied episodic key the layer
             was created for. Unset for non-episodic layers.
    MemoryRead:
      required:
        - message
        - memoryLayerId
        - memoryEntryId
      type: object
      properties:
        message:
          type: string
          description: |-
            Human-readable description of the read, set by the runtime. For
             example: "Loaded skill", "Resolved context key". Not machine-parsed;
             intended for UI display alongside the other events in an objective's
             timeline.
        memoryLayerId:
          example: memlyr_01HXKD2E5NQM3T9AYWCFFFBMJH
          type: string
          description: |-
            The layer the entry resolved to. The top-most layer that contained
             the key — other layers beneath it that also contained the key are
             shadowed and not referenced here.
        memoryEntryId:
          example: mementry_01HXKD2E5NQM3T9AYWCF5E52Z0
          type: string
          description: The specific entry that was read.
      description: |-
        MemoryRead is emitted each time the agent resolves a key against the
         memory cascade and loads an entry. Lookups that miss (key not found in
         any layer) do not emit this event.
    MemoryReference:
      required:
        - memoryLayerId
      type: object
      properties:
        memoryLayerId:
          example: memlyr_01HXKD2E5NQM3T9AYWCFFFBMJH
          type: string
        memoryEntryId:
          example: mementry_01HXKD2E5NQM3T9AYWCF5E52Z0
          type: string
          description: |-
            When set, inserts only this entry from memory_layer_id into the cascade —
             behaves as a single-entry layer (only this key resolves at this
             position). The entry must belong to memory_layer_id; mismatches are
             rejected with InvalidArgument.
      description: |-
        MemoryReference identifies a memory layer or a specific entry within
         one, for composition into a memory cascade. Used on objectives (where
         entry pinning is permitted).

         memory_layer_id accepts both the canonical form (memlyr_…) and the
         external-id form (external_id:my-custom-id). The same applies to
         memory_entry_id when set.
    Model:
      required:
        - metadata
        - spec
        - state
      type: object
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Resource metadata
        spec:
          allOf:
            - $ref: '#/components/schemas/ModelSpec'
          description: Model specification
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ModelInfo'
          description: |-
            Server-populated info (e.g. the AI provider this model routes through).
             Populated on reads when requested; see ListModelsRequest.include_info.
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - STATE_ENABLED
            - STATE_DISABLED
          type: string
          description: |-
            Whether the model is usable in this workspace. Output only. Use the
             :enable and :disable actions to transition.
          format: enum
    ModelInfo:
      required:
        - agentVariationCount
      type: object
      properties:
        aiProviderKey:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AIProviderKey'
          description: |-
            The AI provider key powering this model, embedded so clients can read the
             provider, key name, and promotional status (info.is_promotional) without a
             second lookup. The key's model counts are not populated here; use the AI
             provider key endpoints for those.
        agentVariationCount:
          readOnly: true
          type: integer
          description: |-
            Number of agent variations currently provisioned on this model. Useful for
             previewing how many variations a swap would affect.
          format: int32
        lastUsedAt:
          readOnly: true
          type: string
          description: Represents the last time this model was used in an agent objective
          format: date-time
      description: ModelInfo carries server-derived, read-only details about a model.
    ModelSpec:
      required:
        - provider
        - family
        - maxInputTokens
        - maxOutputTokens
        - inputPricePerMillionTokens
        - outputPricePerMillionTokens
        - capabilities
      type: object
      properties:
        provider:
          type: string
          description: The model provider (e.g., "anthropic", "openai", "google")
        family:
          type: string
          description: The model family (e.g., "claude-sonnet-4.6", "gpt-5.4", "gemini-2.5-flash")
        maxInputTokens:
          type: integer
          description: Maximum number of input tokens the model supports
          format: int32
        maxOutputTokens:
          type: integer
          description: Maximum number of output tokens the model can generate
          format: int32
        inputPricePerMillionTokens:
          type: string
          description: Cost per million input tokens in cents (e.g., 300 = $3.00)
        outputPricePerMillionTokens:
          type: string
          description: Cost per million output tokens in cents (e.g., 1500 = $15.00)
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModelSpec_Capability'
          description: |-
            The inference knobs this model supports. Catalog data; drives which
             ModelConfig fields a variation on this model may set. Reasoning support
             (and its mode) lives here too, as the "reasoning" capability.
    ModelSpec_Capability:
      oneOf:
        - $ref: '#/components/schemas/ModelSpec_Capability_Temperature'
        - $ref: '#/components/schemas/ModelSpec_Capability_TopP'
        - $ref: '#/components/schemas/ModelSpec_Capability_TopK'
        - $ref: '#/components/schemas/ModelSpec_Capability_StopSequences'
        - $ref: '#/components/schemas/ModelSpec_Capability_MaxOutputTokens'
        - $ref: '#/components/schemas/ModelSpec_Capability_Reasoning'
        - $ref: '#/components/schemas/ModelSpec_Capability_Caching'
      discriminator:
        propertyName: type
        mapping:
          temperature: '#/components/schemas/ModelSpec_Capability_Temperature'
          topP: '#/components/schemas/ModelSpec_Capability_TopP'
          topK: '#/components/schemas/ModelSpec_Capability_TopK'
          stopSequences: '#/components/schemas/ModelSpec_Capability_StopSequences'
          maxOutputTokens: '#/components/schemas/ModelSpec_Capability_MaxOutputTokens'
          reasoning: '#/components/schemas/ModelSpec_Capability_Reasoning'
          caching: '#/components/schemas/ModelSpec_Capability_Caching'
      description: |-
        Capability describes one inference knob this model supports, with any
         model-specific parameters for it. A variation's ModelConfig may only
         set a knob whose capability is listed on the model's spec.
    Notice:
      required:
        - level
        - message
        - key
      type: object
      properties:
        level:
          enum:
            - LEVEL_UNSPECIFIED
            - LEVEL_INFO
            - LEVEL_WARN
            - LEVEL_INFO
            - LEVEL_WARN
          type: string
          format: enum
        message:
          type: string
          description: Human-readable description of what happened.
        key:
          type: string
          description: |-
            Stable machine-readable identifier for the notice kind (for example
             "tool_set_load_failed", "tool_archived"). Clients can switch on it or use
             it as an i18n key; the message is the English fallback.
      description: |-
        Notice is a non-terminal diagnostic emitted by the runtime when something
         noteworthy but non-fatal happens during an objective — for example a
         just-in-time tool set failing to load, or a previously loaded tool being
         dropped because it was archived. Notices carry no structured payload; they
         exist to make the objective timeline self-explanatory.
    Objective:
      required:
        - metadata
        - configSnapshot
        - state
        - systemPrompt
        - firstUserMessage
        - stateMessage
        - parentObjectiveId
        - secrets
        - memoryCascade
        - pinnedParameters
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        configSnapshot:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ObjectiveConfigSnapshot'
          description: |-
            The snapshot of the agent and the variation selected (either explicitly or by sampling) will be set here. Cadenya stores
             the point-in-time snapshot of the configuration used to start an objective and maintains it throughout the entire lifecycle
             so that changes to agents and variations in the middle of a cycle don't impact the objective itself
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - STATE_PENDING
            - STATE_RUNNING
            - STATE_WAITING
            - STATE_FAILED
            - STATE_CANCELLED
            - STATE_FINALIZED
            - STATE_TIMED_OUT
          type: string
          description: The current lifecycle state of the objective.
          format: enum
        stateMessage:
          readOnly: true
          type: string
          description: Optional human-readable detail about the current state (e.g. a failure reason).
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ObjectiveInfo'
          description: Read-only aggregated info about this objective's execution
        systemPrompt:
          readOnly: true
          type: string
          description: system_prompt is read-only, derived from the selected variation's prompt
        firstUserMessage:
          type: string
          description: |-
            The first user message in the LLM chat history, either provided explicitly at
             creation or rendered from the variation's first_user_message_template.
        parentObjectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: A parent objective means the objective was spawned off using a separate agent to complete an objective
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/Objective_Secret'
          description: Secrets that can be used in the headers for tool calls using the secret interpolation format.
        systemPromptData:
          readOnly: true
          type: object
          additionalProperties: true
          description: Arbitrary data rendered into the variation's system_prompt_template
        memoryCascade:
          type: array
          items:
            $ref: '#/components/schemas/MemoryReference'
          description: |-
            Memory layers/entries layered over the baseline cascade inherited
             from the selected variation — element-level rules over inherited
             styles, in CSS terms.

             Array order is resolution order: EARLIER elements are more specific
             and are consulted first. Entries pinned via memory_entry_id behave
             as single-entry layers at their position.

             System-managed layers (e.g., episodic) cannot be referenced here;
             they attach themselves automatically based on the episodic key.

             Size cap: the TOTAL effective cascade (this field + the variation's
             memory layer assignments) must not exceed 10 entries. A request
             that would produce a larger cascade is rejected with
             InvalidArgument.
        output:
          readOnly: true
          type: object
          additionalProperties: true
          description: |-
            The output of the objective, populated when the objective completes. Will match the schema of output_json_schema or output_json_inferred.
             This will only be set if the state of the objective is set to STATE_FINALIZED
        firstUserMessageData:
          readOnly: true
          type: object
          additionalProperties: true
          description: Arbitrary data rendered into the variation's first_user_message_template
        episodicMemory:
          allOf:
            - $ref: '#/components/schemas/ObjectiveEpisodicConfig'
          description: |-
            If the agent variation that is selected has episodic memory enabled, then this key is used to create/update a memory layer
             specific to the episodic memory. The layer may have a TTL configured by the variation.
        pinnedParameters:
          readOnly: true
          type: object
          additionalProperties:
            type: string
          description: |-
            Parameters forced onto this objective's tool calls, as provided at
             creation. See CreateObjectiveRequest.pinned_parameters for semantics.
      description: |-
        Objective is the data for an objective. It contains the snapshotted fields for the selected agent and variation. Secrets are returned
         only with their names, and the output definition is copied from the agent's configuration.
    ObjectiveCancelled:
      required:
        - message
      type: object
      properties:
        message:
          type: string
          description: |-
            Optional human-readable note recorded at cancel time. Today the workflow
             sets "Cancelled" but this field leaves room for richer reasons (e.g.
             "Cancelled by user", "Cancelled by schedule sweep", "Credit balance exhausted").
      description: |-
        ObjectiveCancelled is the terminal event written when an objective is
         cancelled. After this event, the objective is super-terminal: no further
         iterations, compaction, or continuation are permitted.
    ObjectiveConfigSnapshot:
      required:
        - agent
        - agentVariation
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        agentVariation:
          $ref: '#/components/schemas/AgentVariation'
        agentSchedule:
          $ref: '#/components/schemas/AgentSchedule'
      description: |-
        ObjectiveConfigSnapshot is the point-in-time snapshot of the agent, variation, and
         (when applicable) schedule that an objective was started with.
    ObjectiveContextWindow:
      required:
        - metadata
        - data
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        data:
          $ref: '#/components/schemas/ObjectiveContextWindowData'
        info:
          $ref: '#/components/schemas/ObjectiveContextWindowInfo'
      description: |-
        ObjectiveContextWindow is a window of chat completions that is grouped together to prevent context-window overflows. Context windows also allow
         agents to compact their windows and carry on into a new one.
    ObjectiveContextWindowData:
      required:
        - objectiveId
        - sequence
        - promptTokens
        - completionTokens
        - previousWindowContinueInstructions
      type: object
      properties:
        objectiveId:
          readOnly: true
          example: obj_01HXKD2E5NQM3T9AYWCFQAZGFV
          type: string
          description: The objective's ID that this window belongs to
        sequence:
          readOnly: true
          type: integer
          description: |-
            sequence is a numeric representation of which context window this is. Sequences are useful to perform a max(sequence) on in order
             to calculate how many context windows an objective has.
          format: int32
        promptTokens:
          readOnly: true
          type: integer
          description: A calculated value for how many prompt tokens (input tokens) have been used in this context window
          format: int32
        completionTokens:
          readOnly: true
          type: integer
          description: A calculated value for how many completion tokens (output tokens) have been used in this context window
          format: int32
        previousWindowContinueInstructions:
          type: string
          description: The instructions for this window to continue from a previous window's chat history.
    ObjectiveContextWindowInfo:
      type: object
      properties:
        objective:
          $ref: '#/components/schemas/OperationMetadata'
        createdBy:
          $ref: '#/components/schemas/Profile'
    ObjectiveDiagnostics:
      required:
        - contextLengths
        - inputTokens
        - cachedInputTokens
      type: object
      properties:
        contextLengths:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ContextLengths'
          description: Measured character lengths per context component.
        inputTokens:
          readOnly: true
          type: integer
          description: Input tokens reported by the LLM provider for the iteration's completion.
          format: int32
        cachedInputTokens:
          readOnly: true
          type: integer
          description: |-
            The portion of input_tokens served from the provider's prompt cache.
             Lets clients distinguish "big but cached" from "big and paid fresh
             every iteration".
          format: int32
      description: |-
        ObjectiveDiagnostics is the context-usage breakdown measured for a single
         iteration at request-assembly time. It reports how much of the context
         window each component occupies so tool parameters, memory cascades, and
         prompts can be tuned against real token usage.
    ObjectiveEpisodicConfig:
      required:
        - key
        - memoryLayerId
      type: object
      properties:
        key:
          type: string
          description: |-
            The caller-supplied episodic key. Objectives created with the same key
             (for the same agent) share one episodic memory layer.
        memoryLayerId:
          readOnly: true
          example: memlyr_01HXKD2E5NQM3T9AYWCFFFBMJH
          type: string
          description: |-
            The episodic memory layer resolved (created or reused) for this
             objective's key. Populated by the system at objective creation.
      description: Episodic is used to configure the episodic memory for the objective
    ObjectiveError:
      required:
        - type
        - message
      type: object
      properties:
        type:
          type: string
        message:
          type: string
    ObjectiveEvent:
      required:
        - metadata
        - data
        - contextWindowId
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        data:
          $ref: '#/components/schemas/ObjectiveEventData'
        contextWindowId:
          example: objwin_01HXKD2E5NQM3T9AYWCFN7BSTR
          type: string
        info:
          $ref: '#/components/schemas/ObjectiveEventInfo'
        duration:
          readOnly: true
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: string
          description: |-
            Elapsed time of the work this event records, when it is known at
             write time (e.g. assistant message generation, tool execution for
             result/error events). Unset means the event is instantaneous or the
             duration is not measurable. Serialized as a canonical duration
             string (e.g. "4.1s"). Always set together with started_at.
        startedAt:
          readOnly: true
          type: string
          description: |-
            When the work this event records began. Set together with duration,
             so the work interval is [started_at, started_at + duration]. The
             event's created_at remains the time the event was persisted.
          format: date-time
    ObjectiveEventData:
      oneOf:
        - $ref: '#/components/schemas/ObjectiveEventData_UserMessage'
        - $ref: '#/components/schemas/ObjectiveEventData_ToolApprovalRequested'
        - $ref: '#/components/schemas/ObjectiveEventData_ToolApproved'
        - $ref: '#/components/schemas/ObjectiveEventData_ToolDenied'
        - $ref: '#/components/schemas/ObjectiveEventData_ToolCalled'
        - $ref: '#/components/schemas/ObjectiveEventData_Error'
        - $ref: '#/components/schemas/ObjectiveEventData_AssistantMessage'
        - $ref: '#/components/schemas/ObjectiveEventData_ToolResult'
        - $ref: '#/components/schemas/ObjectiveEventData_ToolError'
        - $ref: '#/components/schemas/ObjectiveEventData_ContextWindowCompacted'
        - $ref: '#/components/schemas/ObjectiveEventData_MemoryRead'
        - $ref: '#/components/schemas/ObjectiveEventData_Cancelled'
        - $ref: '#/components/schemas/ObjectiveEventData_SubAgentSpawned'
        - $ref: '#/components/schemas/ObjectiveEventData_SubAgentUpdated'
        - $ref: '#/components/schemas/ObjectiveEventData_Finalized'
        - $ref: '#/components/schemas/ObjectiveEventData_Notice'
        - $ref: '#/components/schemas/ObjectiveEventData_TimedOut'
        - $ref: '#/components/schemas/ObjectiveEventData_Reasoning'
      discriminator:
        propertyName: type
        mapping:
          userMessage: '#/components/schemas/ObjectiveEventData_UserMessage'
          toolApprovalRequested: '#/components/schemas/ObjectiveEventData_ToolApprovalRequested'
          toolApproved: '#/components/schemas/ObjectiveEventData_ToolApproved'
          toolDenied: '#/components/schemas/ObjectiveEventData_ToolDenied'
          toolCalled: '#/components/schemas/ObjectiveEventData_ToolCalled'
          error: '#/components/schemas/ObjectiveEventData_Error'
          assistantMessage: '#/components/schemas/ObjectiveEventData_AssistantMessage'
          toolResult: '#/components/schemas/ObjectiveEventData_ToolResult'
          toolError: '#/components/schemas/ObjectiveEventData_ToolError'
          contextWindowCompacted: '#/components/schemas/ObjectiveEventData_ContextWindowCompacted'
          memoryRead: '#/components/schemas/ObjectiveEventData_MemoryRead'
          cancelled: '#/components/schemas/ObjectiveEventData_Cancelled'
          subAgentSpawned: '#/components/schemas/ObjectiveEventData_SubAgentSpawned'
          subAgentUpdated: '#/components/schemas/ObjectiveEventData_SubAgentUpdated'
          finalized: '#/components/schemas/ObjectiveEventData_Finalized'
          notice: '#/components/schemas/ObjectiveEventData_Notice'
          timedOut: '#/components/schemas/ObjectiveEventData_TimedOut'
          reasoning: '#/components/schemas/ObjectiveEventData_Reasoning'
    ObjectiveEventInfo:
      required:
        - createdBy
      type: object
      properties:
        objective:
          $ref: '#/components/schemas/OperationMetadata'
        createdBy:
          $ref: '#/components/schemas/Profile'
    ObjectiveFeedback:
      required:
        - metadata
        - data
        - info
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        data:
          $ref: '#/components/schemas/ObjectiveFeedbackData'
        info:
          $ref: '#/components/schemas/ObjectiveFeedbackInfo'
      description: |-
        ObjectiveFeedback represents feedback submitted for an objective's execution.
         Feedback is used to score agent variations and improve agent performance over time.
    ObjectiveFeedbackData:
      type: object
      properties:
        score:
          type: number
          description: |-
            A score between -1.0 and 1.0 representing the quality of the objective's execution.
             -1.0 is the worst possible score, 0.0 is neutral, and 1.0 is the best.
          format: float
        comment:
          type: string
          description: Optional human-readable comment explaining the feedback
    ObjectiveFeedbackInfo:
      required:
        - submittedBy
      type: object
      properties:
        submittedBy:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Profile'
          description: The profile that submitted the feedback
        objective:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BareMetadata'
          description: The objective the feedback was submitted for.
        agentVariation:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BareMetadata'
          description: The agent variation that executed the objective this feedback is about.
    ObjectiveFinalized:
      type: object
      properties:
        output:
          type: object
          description: |-
            If the objective was created with an output schema, and the agent
             successfully completed the objective, this field will contain the
             structured output of the objective.
      description: |-
        ObjectiveFinalized is the terminal event written when an objective is
         finalized. After this event, the objective is super-terminal: no further
         iterations, compaction, or continuation are permitted.
    ObjectiveInfo:
      required:
        - totalEvents
        - totalToolCalls
        - totalInputTokens
        - totalOutputTokens
        - totalContextWindows
        - totalIterations
        - createdBy
        - effectiveMemoryCascade
        - agent
        - agentVariation
        - currentContextWindowId
      type: object
      properties:
        totalEvents:
          readOnly: true
          type: integer
          description: Total number of events generated during this objective's execution
          format: int32
        totalToolCalls:
          readOnly: true
          type: integer
          description: Total number of tool calls made during execution
          format: int32
        totalInputTokens:
          readOnly: true
          type: integer
          description: Total input tokens consumed across all LLM completions across all context windows
          format: int32
        totalOutputTokens:
          readOnly: true
          type: integer
          description: Total output tokens generated across all LLM completions across all context windows
          format: int32
        totalContextWindows:
          readOnly: true
          type: integer
          description: Total number of context windows that this objective has generated
          format: int32
        totalIterations:
          readOnly: true
          type: integer
          format: int32
        createdBy:
          $ref: '#/components/schemas/Profile'
        effectiveMemoryCascade:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/MemoryReference'
          description: |-
            The effective memory cascade at objective creation time: the
             episodic layer (when present), then Objective.memory_cascade, then
             the variation's baseline layers by ascending position. Order is
             resolution order — index 0 is the most specific and is consulted
             first; the first layer containing a key wins. Returned on reads so
             clients can see exactly what the objective resolves against without
             re-joining variation state.
        agent:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Agent details (not snapshotted).
        agentVariation:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Agent variation details (not snapshotted).
        currentContextWindowId:
          readOnly: true
          example: objwin_01HXKD2E5NQM3T9AYWCFN7BSTR
          type: string
          description: |-
            ID of the objective's current (most recent) context window. Hydrated on
             demand; empty when the objective has not yet produced a context window.
        tenant:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/TenantReference'
          description: |-
            The tenant this objective is associated with, when one was asserted at
             creation (directly or via a widget session).
        subject:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/SubjectReference'
          description: |-
            The subject (person within the tenant) this objective is associated
             with, when one was asserted at creation.
        widget:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BareMetadata'
          description: |-
            The widget this objective's conversation ran through, when it was
             created via a widget session.
      description: ObjectiveInfo provides read-only aggregated statistics about an objective's execution
    ObjectiveTask:
      required:
        - metadata
        - data
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/BareMetadata'
        data:
          $ref: '#/components/schemas/ObjectiveTaskData'
      description: |-
        ObjectiveTask represents a task within an objective, typically created and managed by an AI agent
         to track progress toward completing the objective.
    ObjectiveTaskData:
      required:
        - number
        - task
        - completed
      type: object
      properties:
        number:
          readOnly: true
          type: integer
          description: The sequential number of this task within the objective (auto-assigned, 1-based)
          format: int32
        task:
          type: string
          description: Description of the task to be completed
        completed:
          type: boolean
          description: Whether the task has been completed
        completedAt:
          readOnly: true
          type: string
          description: Timestamp when the task was marked as completed
          format: date-time
    ObjectiveTimedOut:
      required:
        - message
      type: object
      properties:
        message:
          type: string
          description: |-
            Human-readable note recorded at timeout time (e.g. "Timed out after 2h
             of inactivity").
      description: |-
        ObjectiveTimedOut is the terminal event written when an objective is
         finalized by the inactivity sweep because it saw no activity (no user
         messages, no LLM calls) within its variation's inactivity timeout — or the
         system-wide 24 hour maximum when no timeout is configured. The objective
         produces no output. After this event, the objective is super-terminal: no
         further iterations, compaction, or continuation are permitted.
    ObjectiveTool:
      required:
        - metadata
        - snapshot
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/BareMetadata'
        snapshot:
          allOf:
            - $ref: '#/components/schemas/Tool'
          description: |-
            Snapshot of the tool at the time it was assigned to the objective. Because tools can change over time, snapshots
             are used to ensure tools don't change unexpectedly during an objective's lifecycle.
      description: ObjectiveTool represents a tool that was assigned to an objective.
    ObjectiveToolCall:
      required:
        - metadata
        - data
        - status
        - executionStatus
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        data:
          $ref: '#/components/schemas/ObjectiveToolCallData'
        status:
          enum:
            - TOOL_CALL_STATUS_UNSPECIFIED
            - TOOL_CALL_STATUS_AUTO_APPROVED
            - TOOL_CALL_STATUS_WAITING_FOR_APPROVAL
            - TOOL_CALL_STATUS_APPROVED
            - TOOL_CALL_STATUS_DENIED
          type: string
          description: Current status of the tool call
          format: enum
        info:
          $ref: '#/components/schemas/ObjectiveToolCallInfo'
        executionStatus:
          readOnly: true
          enum:
            - TOOL_CALL_EXECUTION_STATUS_UNSPECIFIED
            - TOOL_CALL_EXECUTION_STATUS_PENDING
            - TOOL_CALL_EXECUTION_STATUS_RUNNING
            - TOOL_CALL_EXECUTION_STATUS_COMPLETED
            - TOOL_CALL_EXECUTION_STATUS_ERRORED
            - TOOL_CALL_EXECUTION_STATUS_WAITING_FOR_CONTENT
          type: string
          format: enum
      description: |-
        ObjectiveToolCall is a record of a tool call made during an objective's execution.
         Tool calls are mutable — their status changes as they are approved, denied, or executed.
    ObjectiveToolCallData:
      required:
        - callable
        - resolvedSecrets
        - arguments
      type: object
      properties:
        callable:
          allOf:
            - $ref: '#/components/schemas/CallableTool'
          description: The tool that was called
        arguments:
          type: object
          additionalProperties: true
          description: The arguments passed to the tool
        memo:
          type: string
          description: A memo supplied by the reviewer when denying the tool call
        statusChangedBy:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Profile'
          description: The profile that changed the status of this tool call. Set when the status is changed to APPROVED or DENIED by a user.
        resolvedSecrets:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ResolvedSecret'
          description: List of resolved secrets used by the tool call
    ObjectiveToolCallInfo:
      required:
        - objective
      type: object
      properties:
        objective:
          $ref: '#/components/schemas/OperationMetadata'
        createdBy:
          $ref: '#/components/schemas/Profile'
        tool:
          $ref: '#/components/schemas/BareMetadata'
        toolSet:
          $ref: '#/components/schemas/BareMetadata'
    ObjectiveToolCallResult:
      required:
        - content
      type: object
      properties:
        content:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveToolCallResult_ContentBlock'
          description: |-
            The result content as recorded — which is what the model was shown.
             When a tool set overlay transformed the result (ToolOverlay
             result_actions), this is the transformed content; the adapter's raw
             response is kept in the tool call's debug log, not here.
      description: |-
        ObjectiveToolCallResult is the content a tool returned after execution.
         Tools can return multiple content blocks, and blocks can be multi-modal
         (text, image, audio). Media blocks are stored by Cadenya and served as
         short-lived signed URLs rather than inline bytes.
    ObjectiveToolCallResult_AudioBlock:
      required:
        - url
        - mimeType
        - sizeBytes
        - expiresAt
      type: object
      properties:
        url:
          readOnly: true
          type: string
          description: Short-lived signed URL to download the stored audio.
        mimeType:
          readOnly: true
          type: string
          description: IANA media type of the stored audio, e.g. audio/wav.
        sizeBytes:
          readOnly: true
          type: string
          description: Size of the stored audio in bytes.
        expiresAt:
          readOnly: true
          type: string
          description: When the signed URL expires.
          format: date-time
    ObjectiveToolCallResult_ContentBlock:
      oneOf:
        - $ref: '#/components/schemas/ObjectiveToolCallResult_ContentBlock_Text'
        - $ref: '#/components/schemas/ObjectiveToolCallResult_ContentBlock_Image'
        - $ref: '#/components/schemas/ObjectiveToolCallResult_ContentBlock_Audio'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/ObjectiveToolCallResult_ContentBlock_Text'
          image: '#/components/schemas/ObjectiveToolCallResult_ContentBlock_Image'
          audio: '#/components/schemas/ObjectiveToolCallResult_ContentBlock_Audio'
      description: |-
        ContentBlock is a single block of tool result content. Exactly one of
         the variants is set.
    ObjectiveToolCallResult_ImageBlock:
      required:
        - url
        - mimeType
        - sizeBytes
        - expiresAt
      type: object
      properties:
        url:
          readOnly: true
          type: string
          description: Short-lived signed URL to download the stored image.
        mimeType:
          readOnly: true
          type: string
          description: IANA media type of the stored image, e.g. image/png.
        sizeBytes:
          readOnly: true
          type: string
          description: Size of the stored image in bytes.
        expiresAt:
          readOnly: true
          type: string
          description: When the signed URL expires.
          format: date-time
    ObjectiveToolCallResult_TextBlock:
      required:
        - text
      type: object
      properties:
        text:
          readOnly: true
          type: string
    ObjectiveToolCallWithResult:
      required:
        - metadata
        - data
        - status
        - executionStatus
        - info
        - resolvedSecrets
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        data:
          $ref: '#/components/schemas/ObjectiveToolCallData'
        status:
          enum:
            - TOOL_CALL_STATUS_UNSPECIFIED
            - TOOL_CALL_STATUS_AUTO_APPROVED
            - TOOL_CALL_STATUS_WAITING_FOR_APPROVAL
            - TOOL_CALL_STATUS_APPROVED
            - TOOL_CALL_STATUS_DENIED
          type: string
          description: Current status of the tool call
          format: enum
        info:
          $ref: '#/components/schemas/ObjectiveToolCallInfo'
        executionStatus:
          readOnly: true
          enum:
            - TOOL_CALL_EXECUTION_STATUS_UNSPECIFIED
            - TOOL_CALL_EXECUTION_STATUS_PENDING
            - TOOL_CALL_EXECUTION_STATUS_RUNNING
            - TOOL_CALL_EXECUTION_STATUS_COMPLETED
            - TOOL_CALL_EXECUTION_STATUS_ERRORED
            - TOOL_CALL_EXECUTION_STATUS_WAITING_FOR_CONTENT
          type: string
          format: enum
        result:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ObjectiveToolCallResult'
          description: |-
            The content returned by the tool. Only set once execution_status is
             TOOL_CALL_EXECUTION_STATUS_COMPLETED.
        resolvedSecrets:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ResolvedSecret'
          description: List of resolved secrets used by the tool call
      description: |-
        ObjectiveToolCallWithResult is an ObjectiveToolCall plus the content the
         tool returned. Returned by GetObjectiveToolCall.
    Objective_Secret:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    OmitToolRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        toolSetId:
          readOnly: true
          example: toolset_01HXKD2E5NQM3T9AYWCFNRMN74
          type: string
          description: |-
            Tool set ID. Accepts the canonical ts_… form or the
             external_id:<value> form.
        id:
          readOnly: true
          example: tool_01HXKD2E5NQM3T9AYWCFWVYY9K
          type: string
          description: |-
            Tool ID. Accepts the canonical tool_… form or the
             external_id:<value> form.
      description: Omit tool request
    OpenAICompatibleConfig:
      required:
        - baseUrl
      type: object
      properties:
        baseUrl:
          type: string
      description: |-
        OpenAICompatibleConfig configures a generic endpoint that speaks the OpenAI
         Chat Completions API. The base URL is required and its model catalog is
         discovered live via GET {base_url}/models.
    OpenAIConfig:
      type: object
      properties:
        organizationId:
          type: string
          description: Sent as the OpenAI-Organization header when set.
        projectId:
          type: string
          description: Sent as the OpenAI-Project header when set.
      description: OpenAIConfig holds OpenAI-specific settings.
    OpenRouterConfig:
      type: object
      properties:
        region:
          type: string
          description: Data-residency region (e.g. "us", "eu"). Empty uses the provider default.
      description: OpenRouterConfig holds OpenRouter-specific settings.
    OperationMetadata:
      required:
        - id
        - accountId
        - workspaceId
        - profileId
        - createdAt
        - labels
        - externalId
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier for the operation (prefixed ULID, e.g., "obj_01HXK...")
        accountId:
          readOnly: true
          example: account_01HXKD2E5NQM3T9AYWCFTJHJVF
          type: string
          description: Account this operation belongs to for multi-tenant isolation (prefixed ULID)
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace this operation belongs to for organizational grouping (prefixed ULID)
        labels:
          type: object
          additionalProperties:
            type: string
          description: |-
            Key-value pairs for categorization and filtering. Values are 0-63
             alphanumeric characters with "-", "_", or "." allowed between; keys
             follow the same shape and additionally accept an optional DNS-subdomain
             prefix (e.g. "cadenya.com/") of at most 253 characters.
             Examples: {"priority": "high", "source": "api", "workflow": "onboarding"}
        createdAt:
          readOnly: true
          type: string
          description: |-
            Timestamp when this operation was created
             ULID includes timestamp information, but this explicit field enables easier querying
          format: date-time
        externalId:
          type: string
          description: External ID for the operation (e.g., a workflow ID from an external system)
        profileId:
          readOnly: true
          example: profile_01HXKD2E5NQM3T9AYWCFS0AP08
          type: string
          description: ID of the actor (user or service account) that created this operation
      description: Metadata for ephemeral operations and activities (e.g., objectives, executions, runs)
    Page:
      required:
        - nextCursor
      type: object
      properties:
        nextCursor:
          type: string
      description: |-
        Page carries cursor-based pagination state. There is no total: the cursor
         walks the result set without ever counting it, and a count would cost a second
         query on every list.
    ParameterAction_Pin:
      required:
        - path
        - pinnedParameter
        - onMissing
      type: object
      properties:
        path:
          type: string
        pinnedParameter:
          type: string
          description: |-
            Key into the objective's pinned_parameters map. Need not equal the
             last segment of `path` — this is how a pinned `orgId` reaches a
             tool whose parameter is named `organizationId`.
        onMissing:
          enum:
            - ON_MISSING_UNSPECIFIED
            - ON_MISSING_FAIL
            - ON_MISSING_SKIP
            - ON_MISSING_FAIL
            - ON_MISSING_SKIP
          type: string
          description: 'Default: ON_MISSING_FAIL.'
          format: enum
      description: |-
        Bind the parameter to one of the objective's pinned parameters. It is
         deleted from the schema (including any `required` entry), and on every
         call the pinned value is written into the arguments, overwriting
         anything the model supplied.
         This is the authoritative-value action: the model never sees the
         parameter and cannot influence it.

         `pin` differs from `set` with `{{ pinned_parameters.key }}` only in
         how a missing key is handled (see `on_missing`) and in intent —
         reading the tool set config, `pin` says "this comes from the caller".
    ParameterAction_Remove:
      required:
        - path
      type: object
      properties:
        path:
          type: string
      description: |-
        Remove the parameter entirely. It is deleted from the schema
         (including any `required` entry) and stripped from the arguments if
         the model supplies it anyway. The tool receives no value for it — the
         upstream default, if any, applies. Use this to save context on
         parameters the model has no business setting (pagination cursors,
         expansion flags, debug toggles).
    ParameterAction_Set:
      required:
        - path
        - valueTemplate
      type: object
      properties:
        path:
          type: string
        valueTemplate:
          type: string
      description: |-
        Force the parameter to a value. It is deleted from the schema
         (including any `required` entry), and on every call the rendered
         value is written into the arguments, overwriting anything the model
         supplied.

         `value_template` is a Liquid template rendered against the objective:

           {{ pinned_parameters.<key> }}  the objective's pinned parameters
           {{ objective.id }}             the objective's id
           {{ objective.external_id }}    the objective's external id
           {{ objective.labels.<key> }}   the objective's labels

         Templates render with strict variables: referencing a pinned
         parameter or label that does not exist fails the call rather than
         rendering an empty value.

         Tool set secrets are intentionally not exposed here: overlay-set
         values are recorded as tool call arguments in events and tool call
         history, and would leak. Use adapter headers for credentials.

         The rendered string is coerced to the parameter's declared schema
         type: for a non-string parameter (integer, number, boolean, object,
         array) the output is parsed as JSON. A value that fails to parse
         errors the tool call. Prefer `pin` when the value is simply a pinned
         parameter — it fails loudly when the key is absent instead of
         rendering an empty string.
    PauseAgentScheduleRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        agentId:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
        id:
          readOnly: true
          example: as_01HXKD2E5NQM3T9AYWCFMZZZBD
          type: string
          description: Schedule ID. Accepts the canonical `as_…` form or the `external_id:<value>` form.
      description: Pause agent schedule request.
    Profile:
      required:
        - metadata
        - spec
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/AccountResourceMetadata'
        spec:
          $ref: '#/components/schemas/ProfileSpec'
      description: |-
        A profile identifies a user or non-human principal (such as an API key)
         at the account level. Profiles are account-scoped and can be granted access
         to multiple workspaces.
    ProfileSpec:
      required:
        - type
        - email
        - name
      type: object
      properties:
        email:
          type: string
          description: |-
            Email address of the profile. Required and unique within an account for
             user profiles.
        name:
          type: string
          description: Display name (e.g., "Bobby Tables").
        type:
          enum:
            - PROFILE_TYPE_UNSPECIFIED
            - PROFILE_TYPE_USER
            - PROFILE_TYPE_API_KEY
            - PROFILE_TYPE_SYSTEM
          type: string
          description: |-
            Whether this profile represents a human user, an API key, or a system
             principal.
          format: enum
      description: Configuration for a profile.
    PublishAgentRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
      description: Publish agent request
    Reasoning:
      required:
        - content
      type: object
      properties:
        content:
          type: string
          description: |-
            The reasoning text. May be a verbatim chain of thought or a
             provider-generated summary depending on the model.
      description: |-
        Reasoning carries the human-readable reasoning text a model produced while
         working on an iteration — extended thinking (Anthropic, Gemini) or reasoning
         summaries (OpenAI). It is emitted alongside the assistant message from the
         same model response and is purely informational: the text shown here is
         never sent back to the model.
    ResolvedSecret:
      required:
        - key
        - source
      type: object
      properties:
        key:
          type: string
        source:
          enum:
            - RESOLVED_SECRET_SOURCE_UNSPECIFIED
            - RESOLVED_SECRET_SOURCE_WORKSPACE
            - RESOLVED_SECRET_SOURCE_TOOLSET
            - RESOLVED_SECRET_SOURCE_OBJECTIVE
          type: string
          format: enum
      description: |-
        ResolvedSecret is a resolved secret value from the workspace, toolset, or objective. When a tool is called, it will rely
         on secrets in the order of:
         - Objective
         - Toolset
         - Workspace
    ResourceMetadata:
      required:
        - id
        - accountId
        - workspaceId
        - name
        - profileId
        - createdAt
        - externalId
        - labels
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier for the resource (prefixed ULID, e.g., "agent_01HXK...")
        accountId:
          readOnly: true
          example: account_01HXKD2E5NQM3T9AYWCFTJHJVF
          type: string
          description: Account this resource belongs to for multi-tenant isolation (prefixed ULID)
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace this resource belongs to for organizational grouping (prefixed ULID)
        name:
          type: string
          description: |-
            Human-readable name for the resource (e.g., "Customer Support Agent", "Email Tool")
             Required for resources that users interact with directly
        externalId:
          type: string
          description: External ID for the resource (e.g., a workflow ID from an external system)
        labels:
          type: object
          additionalProperties:
            type: string
          description: |-
            Key-value pairs for categorization and filtering. Values are 0-63
             alphanumeric characters with "-", "_", or "." allowed between; keys
             follow the same shape and additionally accept an optional DNS-subdomain
             prefix (e.g. "cadenya.com/") of at most 253 characters.
             Examples: {"environment": "production", "team": "platform", "version": "v2"}
        profileId:
          readOnly: true
          example: profile_01HXKD2E5NQM3T9AYWCFS0AP08
          type: string
          description: ID of the actor (user or service account) that created this resource
        createdAt:
          readOnly: true
          type: string
          description: Timestamp when this resource was created
          format: date-time
        updatedAt:
          readOnly: true
          type: string
          description: Timestamp when this resource was last updated
          format: date-time
      description: Standard metadata for persistent, named resources (e.g., agents, tools, prompts)
    RestoreToolRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        toolSetId:
          readOnly: true
          example: toolset_01HXKD2E5NQM3T9AYWCFNRMN74
          type: string
          description: |-
            Tool set ID. Accepts the canonical ts_… form or the
             external_id:<value> form.
        id:
          readOnly: true
          example: tool_01HXKD2E5NQM3T9AYWCFWVYY9K
          type: string
          description: |-
            Tool ID. Accepts the canonical tool_… form or the
             external_id:<value> form.
      description: Restore tool request
    ResultAction_Transform:
      required:
        - contentTemplate
        - onError
        - expectJson
      type: object
      properties:
        contentTemplate:
          type: string
        onError:
          enum:
            - ON_ERROR_UNSPECIFIED
            - ON_ERROR_RAW_CONTENT
            - ON_ERROR_FAIL
            - ON_ERROR_RAW_CONTENT
            - ON_ERROR_FAIL
          type: string
          description: 'Default: ON_ERROR_RAW_CONTENT.'
          format: enum
        expectJson:
          type: boolean
          description: |-
            Require the tool result to have text content that parses as JSON
             before rendering. A non-JSON (or text-less) result is then an error
             subject to `on_error` even if the template never reads
             `result.json`. Off by default: `result.json` is simply absent for
             non-JSON results, and text-less results skip the transform.
      description: |-
        Replace the result's text content with a rendered Liquid template.
         Used to compact verbose responses to the fields the model actually
         needs, or to rewrite a JSON response into a smaller JSON document.

         `content_template` is rendered against the call:

           {{ result.text }}        the result's text content (text blocks
                                    joined with newlines)
           {{ result.json }}        result.text parsed as JSON — objects and
                                    arrays are navigable (`result.json.items`,
                                    `| map: "id"`); absent when the text is not
                                    valid JSON
           {{ result.blocks }}      every content block: [{type, text?,
                                    mime_type?, size_bytes?}]
           {{ parameters }}         the arguments the tool was called with,
                                    after parameter actions were applied
           {{ tool.name }}          the tool's metadata.name
           {{ tool.llm_tool_name }} the name the model called it by
           {{ pinned_parameters }}  the objective's pinned parameters
           {{ objective.id }} / {{ objective.external_id }} /
           {{ objective.labels.<key> }}

         Templates render with strict variables: referencing `result.json` on
         a non-JSON result, or any other undefined variable, is a render error
         and `on_error` decides the outcome. The `json` filter pretty-prints a
         value as JSON; `sanitized_json` emits it compact and escaped for
         embedding.

         Transforms are text-only. `result.text` and `result.json` are built
         from the result's text blocks; media blocks (images, audio) are opaque
         to the template and pass through unchanged. The rendered text replaces
         the text blocks as a single text block. A result with no text blocks
         at all (an image-only or audio-only result) is out of scope: the
         transform is skipped, the result is recorded as returned, and the
         skip is noted in the tool call's debug log — this is not an `on_error`
         case, nothing was attempted. The one exception is `expect_json`, where
         a result with no text is a violated precondition and `on_error`
         applies.
    ResumeAgentScheduleRequest:
