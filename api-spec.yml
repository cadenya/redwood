        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
    Selector_Condition:
      oneOf:
        - $ref: '#/components/schemas/Selector_Condition_Attribute'
        - $ref: '#/components/schemas/Selector_Condition_HasParameter'
        - $ref: '#/components/schemas/Selector_Condition_Tools'
      discriminator:
        propertyName: type
        mapping:
          attribute: '#/components/schemas/Selector_Condition_Attribute'
          hasParameter: '#/components/schemas/Selector_Condition_HasParameter'
          tools: '#/components/schemas/Selector_Condition_Tools'
      description: A single selector condition.
    Selector_ToolNames:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
      description: |-
        An explicit list of tools, matched on spec.llm_tool_name — the name
         the model calls the tool by. It identifies a tool across versions:
         just-in-time MCP sets keep one tool per signature and every version
         shares the LLM name, so the condition keeps matching as the source
         evolves. Any name in the list matches (OR). Names of tools not (or
         not yet) present in the set are allowed and match nothing.
    SetToolCallContentRequest:
      required:
