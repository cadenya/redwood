tags:
  - name: AIProviderKeyService
  - name: APIKeyService
    description: |-
      Issue, rotate, disable, and revoke a workspace's API keys. Every key
       belongs to exactly one workspace; the system-managed global account key is
       managed via GlobalAPIKeyService instead.
  - name: AccountService
    description: |-
      Manage the authenticated account. Accounts are the top-level organizational
       unit and contain one or more workspaces.
  - name: AgentScheduleService
    description: |-
      Manage recurring schedules attached to agents. Schedules trigger objectives
       on a cadence defined by AgentScheduleSpec.Schedule.
  - name: AgentService
    description: Manage AI agents within a workspace. Agents define AI behavior and tool access.
  - name: AgentVariationService
    description: Manage variations of an agent and their tool, sub-agent, and memory layer assignments.
  - name: GlobalAPIKeyService
    description: |-
      Manage the account's system-provisioned global API key. The global key is
       the only key that spans every workspace; it is created by the system and
       cannot be deleted, so the surface is retrieve, rotate, and the
       disable/enable kill switch.
  - name: MemoryService
    description: |-
      Manage memory layers and their entries. Layers are named containers that can
       be composed into an objective's memory cascade; entries are the keyed values
       within a layer. System-managed layers (e.g., episodic layers created by the
       runtime) cannot be mutated through this API.
  - name: ModelService
    description: |-
      Manage LLM models available to a workspace. Models represent provider and
       family pairs (e.g., "anthropic/claude-sonnet-4.6"). Workspaces are seeded
       with the supported models and you can enable or disable each one.
  - name: ObjectiveEventStreamsService
  - name: ObjectiveService
  - name: ProfilesService
    description: |-
      Operations on profiles, the account-level principals (users, API keys,
       system) that authenticate against the API.
  - name: SearchService
  - name: TenantService
    description: |-
      Read and erase tenants and the subjects under them. Tenants and subjects are
       created by assertion — on objective creation or widget session mint — never
       directly, so this service has no create or update: it exists to enumerate what
       assertions have produced, and to destroy it on request.
  - name: ToolService
    description: |-
      Manage tool sets and the tools they contain. Tool sets group related tools,
       and tools define specific capabilities available to agents.

       When a tool set is managed, only API key actors can modify its tools; human
       (profile) actors cannot.
  - name: UploadService
    description: |-
      Issue short-lived presigned URLs for direct client-to-object-storage
       uploads. Created uploads can be referenced by id when creating or updating
       resources that accept binary content (e.g., MemoryEntry).
  - name: WidgetService
    description: |-
      Manage embeddable chat widgets. A widget binds an agent to a globally
       unique hostname with a per-widget origin allowlist; browsers reach it with
       session tokens minted via WidgetSessionService.
  - name: WidgetSessionService
    description: |-
      Mint and manage widget sessions. Session creation is server-to-server only:
       the customer's backend authenticates its visitor, asserts tenant/subject
       context, attaches any per-visitor secrets, and receives a short-lived
       bearer token the browser uses against the widget host.
  - name: WorkspaceAdminService
    description: |-
      Administer workspaces across the account: create and archive workspaces and
       manage their membership. These operations are account-scoped and require the
       admin role (a token whose profile holds the WorkOS admin role); they live
       under /v1/account/workspaces rather than the workspace-scoped /v1/workspaces
       tree so an admin can manage any workspace in the account, including ones they
       are not themselves a member of.
  - name: WorkspaceSecretService
  - name: WorkspaceService
    description: |-
      Manage workspaces within an account. Workspaces provide organizational
       grouping and isolation for resources such as agents, tools, and API keys.

       This is the workspace-scoped, end-user surface. Administrative operations
       (create / archive workspaces, manage members) live in WorkspaceAdminService
       under /v1/account/workspaces and require the admin role.
webhooks:
  objective_event.user_message:
    post:
      summary: Objective user message event
      description: Triggered when a user message event occurs in an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.assistant_message:
    post:
      summary: Objective assistant message event
      description: Triggered when an assistant message event occurs in an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.tool_result:
    post:
      summary: Objective tool result event
      description: Triggered when a tool result event occurs in an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.tool_approval_requested:
    post:
      summary: Objective tool approval requested event
      description: Triggered when a tool call requires approval. Use the ApproveToolCall or DenyToolCall RPCs to respond.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.tool_called:
    post:
      summary: Objective tool called event
      description: Triggered when a tool call is executed in an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.tool_approved:
    post:
      summary: Objective tool approved event
      description: Triggered when a tool call is approved via the ApproveToolCall RPC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.tool_denied:
    post:
      summary: Objective tool denied event
      description: Triggered when a tool call is denied via the DenyToolCall RPC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.tool_error:
    post:
      summary: Objective tool error event
      description: Triggered when a tool call encounters an error during execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.sub_agent_spawned:
    post:
      summary: Objective sub-agent spawned event
      description: Triggered when a sub-agent is spawned from a parent objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.sub_agent_updated:
    post:
      summary: Objective sub-agent updated event
      description: Triggered when a sub-agent objective's status changes (e.g. running, completed, failed, cancelled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.error:
    post:
      summary: Objective error event
      description: Triggered when an error occurs during objective execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.memory_read:
    post:
      summary: Objective memory read event
      description: Triggered when the agent loads a memory entry by resolving a key against the objective's memory stack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
  objective_event.reasoning:
    post:
      summary: Objective reasoning event
      description: Triggered when the model produces reasoning text (extended thinking or a reasoning summary) during an objective iteration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveEventWebhookData'
      responses:
        '200':
          description: Webhook received successfully
