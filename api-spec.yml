  /v1/workspaces/{workspaceId}/models:
    get:
      tags:
        - ModelService
        - Models
      summary: List models
      description: Lists all models in the workspace
      operationId: ModelService_ListModels
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: prefix
          in: query
          description: |-
            Filter by a prefix of the model's display name, external id, or id
             (case-insensitive). A model's external id is the form used in
             modelConfig.modelId, so a caller holding that can narrow the list by it.
          schema:
            type: string
        - name: query
          in: query
          description: Free-form search query
          schema:
            type: string
        - name: state
          in: query
          description: Filter by model state
          schema:
            enum:
              - STATE_UNSPECIFIED
              - STATE_ENABLED
              - STATE_DISABLED
            type: string
            format: enum
        - name: aiProviderKeyId
          in: query
          description: |-
            Filter to models provisioned on a specific AI provider key. Accepts the
             key's id or an "external_id:"-prefixed slug.
          schema:
            type: string
        - name: isAssigned
          in: query
          description: |-
            Filter models to only ones assigned to an active agent variation/agent.
             Draft agents count as assigned; archived agents do not. Assignment does not
             imply recent traffic — see ModelInfo.last_used_at for that.
          schema:
            type: boolean
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time)
          schema:
            type: string
        - name: includeInfo
          in: query
          description: |-
            When true, populate each item's info (e.g. the AI provider), at the cost of
             extra lookups.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
