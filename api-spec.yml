          example: toolcall_01HXKD2E5NQM3T9AYWCFTANFGV
          type: string
          description: The ID of the objective tool call record that was denied via the DenyToolCall RPC.
        memo:
          type: string
          description: The memo provided by the reviewer when denying the tool call. This is passed to the agent to provide further instructions.
    ToolError:
      required:
        - toolCallId
        - message
      type: object
      properties:
        toolCallId:
          example: toolcall_01HXKD2E5NQM3T9AYWCFTANFGV
          type: string
          description: The ID of the objective tool call record that encountered an error during execution.
        message:
          type: string
    ToolInfo:
      required:
        - signature
      type: object
      properties:
        toolSet:
          $ref: '#/components/schemas/ResourceMetadata'
        createdBy:
          $ref: '#/components/schemas/Profile'
        signature:
          readOnly: true
          type: string
          description: |-
            Content signature identifying the tool within its tool set: a hash of the
             sanitized llm_tool_name, description, and canonical parameters. Two tools
             with the same llm_tool_name but different parameters or description (as
             MCP servers may return per user) have distinct signatures. Computed over
             the raw spec — overlays do not change a tool's signature.
        overlays:
          readOnly: true
          type: array
          items:
            type: string
          description: |-
            Keys of the tool set's overlays whose selectors match this tool
             (ToolSetSpec.overlays), in evaluation order. Disabled overlays are
             excluded. An overlay is listed when its selector matches even if none
             of its actions changed this tool's schema (all its paths were absent),
             so this answers "which policies apply to this tool" — diff
             effective_parameters against spec.parameters for "what changed".
             Empty when no overlay applies.
        effectiveParameters:
          readOnly: true
          type: object
          additionalProperties: true
          description: |-
            The parameter schema as presented to the model: spec.parameters after
             every matching overlay's parameter actions have been applied, in order,
             including maintenance of the schema's `required` list. Actions whose
             outcome depends on the objective (pin with ON_MISSING_SKIP) are applied
             as if the pinned key were present, so this reflects the intended steady
             state rather than any one objective. Equals spec.parameters when no
             overlay applies. Result actions have no effect here.
    ToolOverlay:
      required:
        - key
        - selector
        - disabled
      type: object
      properties:
        key:
          type: string
          description: |-
            Identifies the overlay within its tool set. Unique across the tool
             set's overlays (enforced by the server), stable across reorders, and
             surfaced in tool call diagnostics ("parameter removed by overlay
             strip-list-knobs") so an operator can trace a rewritten call back to
             the policy that rewrote it. Referenced by ToolInfo.overlays and the
             ListToolsRequest.overlays filter.
        selector:
          allOf:
            - $ref: '#/components/schemas/ToolOverlay_Selector'
          description: |-
            Which tools this overlay applies to. Required; an empty selector
             (no conditions) matches every tool in the set.
        parameterActions:
          type: array
          items:
            $ref: '#/components/schemas/ToolOverlay_ParameterAction'
          description: Pre-call actions, applied in order. See ParameterAction.
        resultActions:
          type: array
          items:
            $ref: '#/components/schemas/ToolOverlay_ResultAction'
          description: Post-call actions, applied in order. See ResultAction.
        disabled:
          type: boolean
          description: |-
            When true the overlay is retained in the spec but not evaluated. Lets an
             operator switch a policy off to diagnose a misbehaving tool without
             deleting it and losing the configuration.
      description: |-
        A tool overlay is a policy attached to a tool set that reshapes the tools
         the model sees and calls. It pairs a selector (which tools it applies to)
         with actions that run before a call — rewriting the tool's parameter
         schema and the arguments the model supplied — and after a call —
         rewriting the result before it enters the model's context.

         Overlays exist for two reasons:

           - Authority. Adapter-derived tool sets (OpenAPI especially) expose many
             parameters the model must never guess — a workspace id, a tenant id,
             an account scope. Overlays bind those parameters to the objective's
             `pinned_parameters` (see CreateObjectiveRequest.pinned_parameters):
             the parameter disappears from the schema and the value is forced
             server-side, so the model has no opportunity to supply a different
             one.
           - Context. Large specs carry pagination cursors, expansion flags and
             verbose responses that cost tokens without helping the model.
             Overlays strip parameters, fix them to literals, and compact results.

         Pinned parameters and overlays are complementary: pinned parameters are
         *data* supplied per objective (or per widget session) by the caller;
         overlays are *policy* authored once on the tool set. Pinning by name
         still works without an overlay — a pinned key that matches a top-level
         parameter name is applied to every tool in the objective — overlays are
         for the cases that needs more: nested paths, renamed keys, a subset of
         tools, or values that are literals rather than caller-supplied.

         Evaluation model:

           - Overlays are evaluated in list order; within an overlay, actions are
             evaluated in list order. Later actions win on the same path (a `set`
             followed by a `remove` leaves the parameter removed).
           - The parameter schema the model sees is computed when tools are
             assembled for an objective, so pre-call actions can consult that
             objective's pinned parameters (this is what makes `pin` with
             ON_MISSING_SKIP meaningful). Argument rewriting runs on every call.
           - An action whose `path` does not exist in the tool's parameter schema
             changes nothing in the schema the model sees. This is deliberate: a
             broad selector (every `list_*` tool) may match tools with different
             shapes, and one overlay should be able to cover all of them without
             erroring on the ones that lack a given parameter. At call time the
             model's arguments can still not widen what it controls: `remove`
             strips the path whether or not it is declared, and `set`/`pin`
             overwrite a value the model sent at an undeclared path (a schema this
             evaluator cannot see through, e.g. behind $ref/allOf) while injecting
             nothing into tools that lack the parameter.
           - Overlays apply to just-in-time tool sets as well; the tools are
             evaluated against overlays at the moment they are loaded.
           - Result actions run once, when the tool call's result is recorded; the
             stored result is the transformed one, so every reader (the model,
             compaction, the API) sees the same content. They are not supported on
             bare tool sets.
    ToolOverlay_ParameterAction:
      oneOf:
        - $ref: '#/components/schemas/ToolOverlay_ParameterAction_Remove'
        - $ref: '#/components/schemas/ToolOverlay_ParameterAction_Set'
        - $ref: '#/components/schemas/ToolOverlay_ParameterAction_Pin'
      discriminator:
        propertyName: type
        mapping:
          remove: '#/components/schemas/ToolOverlay_ParameterAction_Remove'
          set: '#/components/schemas/ToolOverlay_ParameterAction_Set'
          pin: '#/components/schemas/ToolOverlay_ParameterAction_Pin'
      description: |-
        A pre-call action. Parameter actions rewrite the tool's parameter
         schema as presented to the model and the arguments the model supplies
         when it calls the tool. Both sides are always kept in agreement: a
         parameter that is hidden from the schema is also stripped from (or
         forced in) the arguments, so the model can neither see nor smuggle it.
    ToolOverlay_ParameterPath:
      required:
        - path
      type: object
      properties:
        path:
          type: string
      description: |-
        A dotted path into a tool's parameter schema. Each segment is a property
         name; the path `filter.workspaceId` addresses
         `properties.filter.properties.workspaceId` in the schema and
         `arguments.filter.workspaceId` in the call. Only object properties are
         addressable — there is no array indexing, wildcarding or filtering.

         This is deliberately not JSONPath: every action needs a single,
         unambiguous location in both the schema and the arguments so that
         removing a parameter from the schema and stripping it from the call are
         guaranteed to agree.
    ToolOverlay_ResultAction:
      oneOf:
        - $ref: '#/components/schemas/ToolOverlay_ResultAction_Transform'
      discriminator:
        propertyName: type
        mapping:
          transform: '#/components/schemas/ToolOverlay_ResultAction_Transform'
      description: |-
        A post-call action. Result actions rewrite a tool call's result after
         the adapter returns and before it is recorded: the transformed content
         is what is stored and what the model reads (ObjectiveToolCallResult
         content). The adapter's raw response is kept in the tool call's debug
         log for operators; it is not otherwise retained.

         Result actions apply to MCP, OpenAPI and HTTP tool sets. They are not
         supported on bare tool sets — a bare tool's content is supplied by an
         external consumer, so there is nothing for the platform to reshape —
         and a tool set whose adapter is `bare` rejects overlays that carry
         result actions.

         When several matching overlays carry transforms they run in overlay
         order, each one reading the previous one's output.
    ToolOverlay_Selector:
      required:
        - operator
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Selector_Condition'
        operator:
          enum:
            - OPERATOR_UNSPECIFIED
            - OPERATOR_AND
            - OPERATOR_OR
            - OPERATOR_AND
            - OPERATOR_OR
          type: string
          description: 'Default: OPERATOR_AND.'
          format: enum
      description: |-
        Which tools in the tool set an overlay applies to. Conditions are
         combined with `operator`; an overlay with no conditions matches every
         tool in the set.
    ToolResult:
      required:
        - toolCallId
        - result
      type: object
      properties:
        toolCallId:
          example: toolcall_01HXKD2E5NQM3T9AYWCFTANFGV
          type: string
        result:
          allOf:
            - $ref: '#/components/schemas/ObjectiveToolCallResult'
          description: The content returned by the tool.
    ToolSet:
      required:
        - metadata
        - spec
        - state
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/ToolSetSpec'
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ToolSetInfo'
          description: Tool set information
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - STATE_ACTIVE
            - STATE_ARCHIVED
          type: string
          description: |-
            The current lifecycle state of the tool set. Output only. Tool sets are
             created STATE_ACTIVE; use the :archive and :unarchive actions to
             transition between states.
          format: enum
    ToolSetAdapter:
      oneOf:
        - $ref: '#/components/schemas/ToolSetAdapter_McpVariant'
        - $ref: '#/components/schemas/ToolSetAdapter_HttpVariant'
        - $ref: '#/components/schemas/ToolSetAdapter_OpenapiVariant'
        - $ref: '#/components/schemas/ToolSetAdapter_BareVariant'
      discriminator:
        propertyName: type
        mapping:
          mcp: '#/components/schemas/ToolSetAdapter_McpVariant'
          http: '#/components/schemas/ToolSetAdapter_HttpVariant'
          openapi: '#/components/schemas/ToolSetAdapter_OpenapiVariant'
          bare: '#/components/schemas/ToolSetAdapter_BareVariant'
    ToolSetAdapter_ApprovalRequirementFilter:
      oneOf:
        - $ref: '#/components/schemas/ToolSetAdapter_ApprovalRequirementFilter_Always'
        - $ref: '#/components/schemas/ToolSetAdapter_ApprovalRequirementFilter_Only'
      discriminator:
        propertyName: type
        mapping:
          always: '#/components/schemas/ToolSetAdapter_ApprovalRequirementFilter_Always'
          only: '#/components/schemas/ToolSetAdapter_ApprovalRequirementFilter_Only'
      description: Approval filters that will automatically set the approval requirement on tools synced from an external source
    ToolSetAdapter_AttributeFilter:
      required:
        - attribute
      type: object
      properties:
        attribute:
          enum:
            - ATTRIBUTE_UNSPECIFIED
            - ATTRIBUTE_NAME
            - ATTRIBUTE_TITLE
            - ATTRIBUTE_DESCRIPTION
            - ATTRIBUTE_LLM_TOOL_NAME
            - ATTRIBUTE_NAME
            - ATTRIBUTE_TITLE
            - ATTRIBUTE_DESCRIPTION
            - ATTRIBUTE_LLM_TOOL_NAME
          type: string
          format: enum
        matcher:
          $ref: '#/components/schemas/ToolSetAdapter_StringMatcher'
      description: Single attribute filter
    ToolSetAdapter_Bare:
      type: object
      properties:
        contentTimeout:
          pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
          type: integer
          description: |-
            How long to wait for content to be set before the tool call errors.
             If unset, the call waits indefinitely.
      description: |-
        Bare tool sets define tools without an execution adapter. A bare tool
         call doesn't fire anything: the objective's workflow pauses and waits
         for an external API consumer to set the tool call's content (e.g.
         human-in-the-loop tools, or a reverse harness that polls for pending
         tool calls, executes locally, and reports results back via
         SetToolCallContent).
    ToolSetAdapter_HTTP:
      type: object
      properties:
        baseUrl:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    ToolSetAdapter_JustInTime:
      type: object
      properties:
        enabled:
          type: boolean
        failObjectiveOnToolListError:
          type: boolean
          description: |-
            If set, an objective will automatically be failed if tools cannot be loaded
             in the initial stages of an objective being created. Tools are loaded asynchronously,
             so this setting is useful for ensuring that an objective continued any further if tools are not available.
      description: 'Defines behavior for just-in-time capable tool set adapters (IE: MCP).'
    ToolSetAdapter_MCP:
      type: object
      properties:
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        includeTools:
          allOf:
            - $ref: '#/components/schemas/ToolSetAdapter_ToolFilter'
          description: Include/exclude with flat filters
        excludeTools:
          $ref: '#/components/schemas/ToolSetAdapter_ToolFilter'
        toolApprovals:
          allOf:
            - $ref: '#/components/schemas/ToolSetAdapter_ApprovalRequirementFilter'
          description: Setting for how to assign tool approval requirements when they are synced from an MCP server
        justInTime:
          allOf:
            - $ref: '#/components/schemas/ToolSetAdapter_JustInTime'
          description: |-
            When enabled, tools are loaded from the MCP server just-in-time at
             objective creation using the objective's resolved secrets, instead of
             being synced ahead of time. Just-in-time tool sets are excluded from
             the background sync system.
    ToolSetAdapter_OpenAPI:
      oneOf:
        - $ref: '#/components/schemas/ToolSetAdapter_OpenAPI_Url'
        - $ref: '#/components/schemas/ToolSetAdapter_OpenAPI_UploadId'
      discriminator:
        propertyName: type
        mapping:
          url: '#/components/schemas/ToolSetAdapter_OpenAPI_Url'
          uploadId: '#/components/schemas/ToolSetAdapter_OpenAPI_UploadId'
    ToolSetAdapter_StringMatcher:
      oneOf:
        - $ref: '#/components/schemas/ToolSetAdapter_StringMatcher_Exact'
        - $ref: '#/components/schemas/ToolSetAdapter_StringMatcher_StartsWith'
        - $ref: '#/components/schemas/ToolSetAdapter_StringMatcher_EndsWith'
        - $ref: '#/components/schemas/ToolSetAdapter_StringMatcher_Contains'
        - $ref: '#/components/schemas/ToolSetAdapter_StringMatcher_Regex'
      discriminator:
        propertyName: type
        mapping:
          exact: '#/components/schemas/ToolSetAdapter_StringMatcher_Exact'
          startsWith: '#/components/schemas/ToolSetAdapter_StringMatcher_StartsWith'
          endsWith: '#/components/schemas/ToolSetAdapter_StringMatcher_EndsWith'
          contains: '#/components/schemas/ToolSetAdapter_StringMatcher_Contains'
          regex: '#/components/schemas/ToolSetAdapter_StringMatcher_Regex'
      description: String matching operations
    ToolSetAdapter_ToolFilter:
      required:
        - operator
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ToolSetAdapter_AttributeFilter'
        operator:
          enum:
            - OPERATOR_UNSPECIFIED
            - OPERATOR_AND
            - OPERATOR_OR
            - OPERATOR_AND
            - OPERATOR_OR
          type: string
          format: enum
      description: Top-level filter with simple boolean logic (no nesting)
    ToolSetEvent:
      required:
        - metadata
        - toolSetId
        - event
      type: object
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/OperationMetadata'
          description: Metadata for this operation event.
        toolSetId:
          readOnly: true
          example: toolset_01HXKD2E5NQM3T9AYWCFNRMN74
          type: string
          description: The tool set this event is associated with.
        event:
          allOf:
            - $ref: '#/components/schemas/ToolSetEventData'
          description: The event payload.
        info:
          $ref: '#/components/schemas/ToolSetEventInfo'
      description: A single event in the tool set's operation timeline.
    ToolSetEventData:
      oneOf:
        - $ref: '#/components/schemas/ToolSetEventData_SyncStarted'
        - $ref: '#/components/schemas/ToolSetEventData_SyncCompleted'
        - $ref: '#/components/schemas/ToolSetEventData_SyncFailed'
      discriminator:
        propertyName: type
        mapping:
          syncStarted: '#/components/schemas/ToolSetEventData_SyncStarted'
          syncCompleted: '#/components/schemas/ToolSetEventData_SyncCompleted'
          syncFailed: '#/components/schemas/ToolSetEventData_SyncFailed'
      description: Event payload for a tool set operation.
    ToolSetEventInfo:
      type: object
      properties:
        toolSet:
          $ref: '#/components/schemas/ResourceMetadata'
        createdBy:
          $ref: '#/components/schemas/Profile'
    ToolSetInfo:
      required:
        - toolCount
        - agentCount
        - availableTools
        - omittedTools
      type: object
      properties:
        toolCount:
          readOnly: true
          type: integer
          format: int32
        agentCount:
          readOnly: true
          type: integer
          format: int32
        lastSync:
          readOnly: true
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Profile'
        availableTools:
          type: integer
          format: int32
        omittedTools:
          type: integer
          format: int32
    ToolSetSecret:
      required:
        - metadata
        - spec
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        spec:
          $ref: '#/components/schemas/ToolSetSecretSpec'
        info:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ToolSetSecretInfo'
          description: Tool set secret information
    ToolSetSecretInfo:
      type: object
      properties:
        lastUsedAt:
          readOnly: true
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Profile'
    ToolSetSecretSpec:
      type: object
      properties:
        value:
          type: string
    ToolSetSpec:
      required:
        - adapter
      type: object
      properties:
        description:
          type: string
        adapter:
          $ref: '#/components/schemas/ToolSetAdapter'
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/ToolOverlay'
          description: |-
            Overlays applied to this tool set's tools, evaluated in order. See
             ToolOverlay. Overlay keys must be unique within the list.

             As a repeated field this is replaced wholesale on update: an
             update_mask of `spec.overlays` swaps the entire list for the one in the
             request. Read-modify-write to add or remove a single overlay.
    ToolSetUsage:
      required:
        - assignedAt
        - agentVariation
        - agent
        - model
      type: object
      properties:
        agentVariation:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Metadata for the agent variation the assignment belongs to.
        agent:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Metadata for the variation's parent agent.
        model:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ResourceMetadata'
          description: Metadata for the model assigned to the variation.
        assignedAt:
          readOnly: true
          type: string
          description: When the assignment was created.
          format: date-time
      description: |-
        ToolSetUsage describes one agent variation that uses the tool set (or, when
         filtering by tool, an individual tool within it).
    ToolSpec:
      required:
        - description
        - parameters
        - config
        - requiresApproval
      type: object
      properties:
        description:
          type: string
        requiresApproval:
          type: boolean
        parameters:
          type: object
          additionalProperties: true
          description: |-
            The tool's JSON Schema, as handed to the LLM. Required, but may be the
             empty object `{}` for a tool that takes no arguments. Requiring it rather
             than defaulting it means a misspelled field name (`inputSchema`, say) is a
             400 instead of a silently parameterless tool.
        config:
          allOf:
            - $ref: '#/components/schemas/ToolSpec_Config'
          description: |-
            Configuration for this specific tool. Transport/Protocol are derived from the tool set adapter, while specifics
             such as endpoint, method, etc, are stored on the tool itself.

             Required, and exactly one adapter must be set.
        llmToolName:
          type: string
          description: |-
            The name provided to the LLM, which may differ from the metadata.name on the tool.
             LLMs have specific length and format requirements, and tool set sources may not comply
             with them, so Cadenya does its best to format names into a usable format.
    ToolSpec_Config:
      oneOf:
        - $ref: '#/components/schemas/ToolSpec_Config_Http'
        - $ref: '#/components/schemas/ToolSpec_Config_Mcp'
        - $ref: '#/components/schemas/ToolSpec_Config_Openapi'
        - $ref: '#/components/schemas/ToolSpec_Config_Bare'
      discriminator:
        propertyName: type
        mapping:
          http: '#/components/schemas/ToolSpec_Config_Http'
          mcp: '#/components/schemas/ToolSpec_Config_Mcp'
          openapi: '#/components/schemas/ToolSpec_Config_Openapi'
          bare: '#/components/schemas/ToolSpec_Config_Bare'
      description: |-
        Config defines the adapter to use for the tool.
         This is used to determine how the tool is called.
         For example, if the tool is an HTTP tool, the adapter will be Http.
         If the tool is an inline tool, the adapter will be Inline.
    UnarchiveAgentRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
      description: Unarchive agent request
    UnarchiveToolSetRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: toolset_01HXKD2E5NQM3T9AYWCFNRMN74
          type: string
          description: |-
            Tool set ID. Accepts the canonical ts_… form or the
             external_id:<value> form.
      description: Unarchive tool set request
    UnarchiveWidgetRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: wgt_01HXKD2E5NQM3T9AYWCFMZZZBD
          type: string
          description: Widget ID. Accepts the canonical `wgt_…` form or the `external_id:<value>` form.
      description: Unarchive widget request.
    UnpublishAgentRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: Workspace ID.
        id:
          readOnly: true
          example: agent_01HXKD2E5NQM3T9AYWCFMGWT9Y
          type: string
          description: Agent ID. Accepts the canonical `agent_…` form or the `external_id:<value>` form.
      description: Unpublish agent request
    UpdateAIProviderKeyRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: The workspace the key belongs to.
        id:
          readOnly: true
          example: aipk_01HXKD2E5NQM3T9AYWCFQ41VW3
          type: string
          description: The key to update.
        metadata:
          $ref: '#/components/schemas/UpdateResourceMetadata'
        spec:
          $ref: '#/components/schemas/AIProviderKeySpec'
        updateMask:
          type: string
          description: Fields to update.
          format: field-mask
    UpdateAPIKeyRequest:
      type: object
      properties:
        workspaceId:
          readOnly: true
          example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
          type: string
          description: The workspace the API key belongs to (path).
        id:
          readOnly: true
          example: apikey_01HXKD2E5NQM3T9AYWCFCSPNQY
          type: string
          description: The API key to update.
        metadata:
          $ref: '#/components/schemas/UpdateAccountResourceMetadata'
        spec:
          $ref: '#/components/schemas/APIKeySpec'
        updateMask:
          type: string
          description: Fields to update.
          format: field-mask
    UpdateAccountResourceMetadata:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: Human-readable name for the resource (e.g., "Production API Key", "Staging Workspace")
        externalId:
          type: string
          description: External ID for the resource (e.g., a workflow ID from an external system)
        labels:
          type: object
          additionalProperties:
            type: string
          description: |-
            Key-value pairs for categorization and filtering. Values are 0-63
             alphanumeric characters with "-", "_", or "." allowed between; keys
             follow the same shape and additionally accept an optional DNS-subdomain
             prefix (e.g. "cadenya.com/") of at most 253 characters.
             Examples: {"environment": "production", "team": "platform", "version": "v2"}
      description: |-
        UpdateAccountResourceMetadata contains the user-provided fields for updating
