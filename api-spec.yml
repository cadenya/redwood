  /v1/workspaces/{workspaceId}/widget_sessions:
    get:
      tags:
        - WidgetSessionService
        - Widget Sessions
      summary: List widget sessions
      description: Lists widget sessions in a workspace, filterable by widget, tenant, subject, and state
      operationId: WidgetSessionService_ListWidgetSessions
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Pagination cursor from previous response.
          schema:
            type: string
        - name: widgetId
          in: query
          description: |-
            Filter to sessions on a specific widget. Accepts the canonical `wgt_…`
             form or the `external_id:<value>` form.
          schema:
            type: string
        - name: tenantId
          in: query
          description: |-
            Filter to sessions belonging to a tenant. Accepts the canonical
             `tenant_…` form or the `external_id:<value>` form.
          schema:
            type: string
        - name: subjectId
          in: query
          description: |-
            Filter to sessions asserted for a subject. Accepts the canonical
             `subj_…` form or the `external_id:<value>` form; the external_id form is
             scoped within a tenant and requires `tenant_id` to also be set.
          schema:
            type: string
        - name: state
          in: query
          description: Filter by state.
          schema:
            enum:
              - STATE_UNSPECIFIED
              - STATE_ACTIVE
              - STATE_EXPIRED
              - STATE_REVOKED
              - STATE_EXHAUSTED
            type: string
            format: enum
        - name: labels
          in: query
          description: |-
            Filters by metadata labels. Comma-separated key=value pairs,
             e.g. "env=prod,team=ai". A resource matches only if every pair
             matches exactly (AND semantics).
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Sort order for results (asc or desc by creation time).
          schema:
            type: string
        - name: includeInfo
          in: query
          description: |-
            When true, the `info` field on each returned session is populated.
             Requests with this flag count more against your rate limit.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWidgetSessionsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      tags:
        - WidgetSessionService
        - Widget Sessions
      summary: Create a widget session
      description: Mints a session against a widget and returns the session bearer token (`spec.token`, returned only on creation) plus the authoritative widget hostname (`info.host`). Asserting a tenant upserts the tenant record; attached secrets flow to every conversation the session creates.
      operationId: WidgetSessionService_CreateWidgetSession
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWidgetSessionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSession'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      tags:
        - WidgetSessionService
        - Widget Sessions
      summary: Delete all of a tenant's widget sessions
      description: Deletes every session belonging to a tenant across all widgets in the workspace, along with the conversations those sessions created — built for GDPR erasure requests. The tenant is required; an empty value is rejected rather than matching everything.
      operationId: WidgetSessionService_DeleteTenantWidgetSessions
      parameters:
        - name: workspaceId
          in: path
          description: Workspace ID.
          required: true
          schema:
            type: string
            example: workspace_01HXKD2E5NQM3T9AYWCF133E3Q
        - name: tenantId
          in: query
          description: |-
            Tenant whose sessions to delete. Required — an empty value is rejected
             rather than matching everything. Accepts the canonical `tenant_…` form or
             the `external_id:<value>` form.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTenantWidgetSessionsResponse'
        default:
          description: Default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
